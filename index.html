// -- PRÓXIMOS MESES: quanto já está comprometido (só Márcio) --
// Parte do mês aberto: parcelas que ainda faltam + fixos + recorrentes. Só lê os dados.
const PROJ_MESES=6;
const PROJ_CORES={fixos:'#3987e5',recorrentes:'#d95926',parcelas:'#9085e9',avulsos:'#199e70'};
const MES_CURTO=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let chartProj=null;
function rotuloMes(ord){return MES_CURTO[ord%12]+'/'+String(Math.floor(ord/12)).slice(-2);}
function calcProjecao(horizonte){
  // Começa no mês atual do calendário (independente do mês aberto no app).
  // Meses que já existem no app usam os lançamentos reais; os demais são estimados
  // a partir do último mês existente (parcelas restantes + fixos + recorrentes).
  const H=horizonte||PROJ_MESES;
  const hoje=new Date();const inicio=hoje.getFullYear()*12+hoje.getMonth();
  const porOrd={};G.months.forEach(mo=>{const o=mesOrdinal(mo.name);if(o!==null)porOrd[o]=mo;});
  const existentes=Object.keys(porOrd).map(Number).sort((a,b)=>a-b);
  if(!existentes.length)return null;
  const ords=Array.from({length:H},(_,i)=>inicio+i);
  const z=()=>Array(H).fill(0);
  const fixos=z(),recorrentes=z(),parcelas=z(),avulsos=z(),real=Array(H).fill(false);
  const parc=it=>String(it.desc||'').match(/(\d+)\s*-\s*(\d+)\s*$/);
  const itens=mo=>['mnu','mc6','fix'].flatMap(k=>(mo[k]||[]).map(it=>({k,it,v:+it.val||0}))).filter(x=>x.v);
  ords.forEach((o,i)=>{
    if(porOrd[o]){
      real[i]=true;
      itens(porOrd[o]).forEach(({k,it,v})=>{
        if(parc(it))parcelas[i]+=v;else if(k==='fix')fixos[i]+=v;else if(it.recorrente)recorrentes[i]+=v;else avulsos[i]+=v;
      });
    }else{
      const L=existentes.filter(e=>e<o).pop();if(L===undefined)return;
      const k=o-L;
      itens(porOrd[L]).forEach(({k:key,it,v})=>{
        const pm=parc(it);
        if(pm){if(+pm[1]+k<=+pm[2])parcelas[i]+=v;}
        else if(key==='fix')fixos[i]+=v;else if(it.recorrente)recorrentes[i]+=v;
      });
    }
  });
  // quando as parcelas terminam (a partir do mês atual)
  const fins=[],vistos=new Set();
  const ultimo=existentes[existentes.length-1];
  existentes.filter(o=>o>=inicio||o===ultimo).forEach(o=>{
    itens(porOrd[o]).forEach(({it,v})=>{
      const pm=parc(it);if(!pm)return;
      const resta=+pm[2]-+pm[1];
      if(o!==ultimo&&resta!==0)return; // nos meses intermediários, só a última parcela
      const fim=o+resta;if(fim<inicio)return;
      const chave=descDisplay(it.desc)+'|'+fim+'|'+v;if(vistos.has(chave))return;vistos.add(chave);
      fins.push({desc:descDisplay(it.desc),val:v,fim});
    });
  });
  // entradas: do mês atual; se não houver, do mês existente mais recente com entradas
  const comEnt=[inicio,...existentes.slice().reverse()].map(o=>porOrd[o]).filter(mo=>mo&&sum(mo.entradas)>0);
  let entrada=0;
  if(comEnt.length){const mo=comEnt[0];const r=(mo.entradas||[]).filter(e=>e.recorrente);entrada=r.length?sum(r):sum(mo.entradas);}
  const labels=ords.map(rotuloMes);
  const totais=ords.map((_,i)=>fixos[i]+recorrentes[i]+parcelas[i]+avulsos[i]);
  return {inicio,ords,labels,fixos,recorrentes,parcelas,avulsos,totais,entrada,fins,real};
}
function htmlProjecao(){
  const P=calcProjecao();
  if(!P)return'';
  const atual=P.totais[0],prox=P.totais[1];
  const livreAtual=P.entrada-atual,pct=P.entrada>0?Math.round(prox/P.entrada*100):null;
  const temAvulsos=P.avulsos.some(v=>v>0),temEstimado=P.real.some(r=>!r);
  // agrupa términos por mês
  const porFim={};P.fins.forEach(f=>{(porFim[f.fim]=porFim[f.fim]||[]).push(f);});
  const fimKeys=Object.keys(porFim).map(Number).sort((a,b)=>a-b);
  const linhasArr=fimKeys.map(fim=>{
    const libera=porFim[fim].reduce((t,f)=>t+f.val,0);
    const agr={};porFim[fim].forEach(f=>{agr[f.desc]=(agr[f.desc]||0)+f.val;});
    const lst=Object.entries(agr).sort((a,b)=>b[1]-a[1]).map(([d])=>d);
    const nomes=lst.slice(0,4).map(escHtml).join(', ')+(lst.length>4?` e mais ${lst.length-4}`:'');
    return `<div class="proj-fim"><div class="proj-fim-mes">${rotuloMes(fim)}</div><div class="proj-fim-body"><div class="proj-fim-nomes">${nomes}</div><div class="proj-fim-sub">Última parcela · libera <b>${fmt(libera)}/mês</b> a partir de ${rotuloMes(fim+1)}</div></div></div>`;
  });
  const linhas=linhasArr.slice(0,4).join('');
  const resto=linhasArr.length>4?`<details class="proj-mais"><summary>Ver todos (${linhasArr.length} meses)</summary>${linhasArr.slice(4).join('')}</details>`:'';
  return `<div class="chart-card proj-card">
    <div class="chart-title">📆 Próximos meses <span style="font-size:11px;color:var(--text3);font-weight:400">— já comprometido · Márcio</span></div>
    <div class="proj-nota">Mês de lançamento: as compras de ${P.labels[0]} entram na fatura que vence no mês seguinte.</div>
    <div class="proj-kpis">
      <div><span>${P.labels[0]} · em andamento</span><b>${fmt(atual)}</b><small>${P.entrada>0?`livre: <b class="${livreAtual<0?'neg':''}">${fmt(livreAtual)}</b>`:'sem entradas lançadas'}</small></div>
      <div><span>${P.labels[1]} · já comprometido</span><b>${fmt(prox)}</b>${pct!==null?`<small>${pct}% das entradas${P.real[1]?'':' · estimado'}</small>`:''}</div>
    </div>
    <div class="chart-wrap" style="height:210px"><canvas id="chart-proj" aria-label="Gráfico de gastos já comprometidos do mês atual e dos próximos meses"></canvas></div>
    <div class="proj-legend">
      <span><i style="background:${PROJ_CORES.fixos}"></i>Fixos</span>
      <span><i style="background:${PROJ_CORES.recorrentes}"></i>Recorrentes</span>
      <span><i style="background:${PROJ_CORES.parcelas}"></i>Parcelas</span>
      ${temAvulsos?`<span><i style="background:${PROJ_CORES.avulsos}"></i>Compras avulsas</span>`:''}
      ${P.entrada>0?`<span><i class="dash"></i>Entradas (${fmt(P.entrada)})</span>`:''}
    </div>
    ${temEstimado?`<div class="proj-nota" style="margin-top:8px">Meses já criados no app usam os lançamentos reais; ${P.real.every(r=>!r)?'todos os meses':'os demais'} são estimativa (parcelas, fixos e recorrentes).</div>`:''}
    ${linhas?`<div class="proj-fins-t">Quando as parcelas terminam</div>${linhas}${resto}`:'<div class="empty" style="padding:14px 0 4px">Nenhuma compra parcelada em andamento 🎉</div>'}
  </div>`;
}
function drawProjecao(){
  const ctx=document.getElementById('chart-proj');
  if(chartProj){chartProj.destroy();chartProj=null;}
  if(!ctx||typeof Chart==='undefined')return;

  if(temAv)ds.push(barra('Compras avulsas',P.avulsos,PROJ_CORES.avulsos,true));

  chartProj=new Chart(ctx,{data:{labels:P.labels,datasets:ds},options:{

let SIM={desc:'',valor:'',n:'',parcela:'',semJuros:true,desde:'',cartao:'auto',margem:null};
let SIM_RES=null,chartSim=null;
function simMargemPadrao(){try{const v=localStorage.getItem('mv_sim_margem');return v?+v:15;}catch(e){return 15;}}
function parseBR(s){s=String(s||'').trim().replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?v:0;}
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDia(d){return String(d.getDate()).padStart(2,'0')+'/'+MES_CURTO[d.getMonth()];}
// Em qual "mês de lançamento" do app cai uma compra feita na data d, no cartão do banco?
function mesLancamentoDaCompra(banco,d){
  for(let k=0;k<3;k++){
    const F=d.getFullYear()*12+d.getMonth()+k; // mês da fatura
    const fech=fechamentoFatura(banco,Math.floor(F/12),F%12);
    if(d<=fech)return F-1;
  }
  return d.getFullYear()*12+d.getMonth()+2;
}
// Melhor janela de compra para que caia no mês de lançamento s: logo depois do fechamento anterior
function janelaCompra(banco,s){
  const fechAnt=fechamentoFatura(banco,Math.floor(s/12),s%12); // fatura do mês s fecha -> compras seguintes vão para s
  const ini=new Date(fechAnt);ini.setDate(ini.getDate()+1);
  const fim=fechamentoFatura(banco,Math.floor((s+1)/12),(s+1)%12);
  const venc=vencimentoFatura(banco,Math.floor((s+1)/12),(s+1)%12);
  return {ini,fim,venc,dias:Math.round((venc-ini)/864e5)};
}

function simular(){
  const valor=parseBR(SIM.valor);
  if(valor<=0)return {erro:'Informe o valor à vista.'};
  const P=calcProjecao(SIM_HORIZ);
  if(!P)return {erro:'Não encontrei meses cadastrados para calcular.'};
  if(!(P.entrada>0))return {erro:'Lance as entradas (salário) do mês atual para eu conseguir calcular.'};
  const margemPct=SIM.margem==null?simMargemPadrao():SIM.margem;
  const margem=P.entrada*margemPct/100;
  // comprometido por mês: índice 0 = mês aberto (gasto real), 1.. = projeção
  const ords=P.ords;
  const comp=P.totais;
  const livre=comp.map(c=>P.entrada-c);
  // opções de pagamento
  const n=Math.max(0,Math.round(parseBR(SIM.n)));
  let parc=parseBR(SIM.parcela);
  const opcoes=[{id:'avista',rot:'À vista',n:1,parcela:valor,total:valor}];
  if(n>=2){
    if(!(parc>0))parc=valor/n;
    const semJuros=Math.abs(parc*n-valor)<0.05*n||SIM.semJuros&&!(parseBR(SIM.parcela)>0);
    if(semJuros){for(let k=2;k<=n;k++)opcoes.push({id:'p'+k,rot:k+'x sem juros',n:k,parcela:valor/k,total:valor});}
    else opcoes.push({id:'p'+n,rot:n+'x de '+fmt(parc),n,parcela:parc,total:parc*n});
  }
  // mês mais cedo possível (pela data desejada)
  const desde=SIM.desde?new Date(SIM.desde+'T12:00:00'):new Date();
  const bancos=SIM.cartao==='auto'?['nu','c6']:[SIM.cartao];
  const sMin=Math.max(P.ords[0],Math.min(...bancos.map(b=>mesLancamentoDaCompra(b,desde))));
  const avaliar=(op,s)=>{
    let pior=Infinity,piorOrd=null;const nova=ords.map(()=>0);
    for(let i=0;i<ords.length;i++){
      const k=ords[i]-s;const add=(k>=0&&k<op.n)?op.parcela:0;nova[i]=add;
      if(k>=0&&k<op.n){const l=livre[i]-add;if(l<pior){pior=l;piorOrd=ords[i];}}
    }
    return {op,s,pior,piorOrd,nova,ok:pior>=margem};
  };
  const ultimo=ords[ords.length-1];
  const linhas=opcoes.map(op=>{
    let melhor=null,primeiro=avaliar(op,sMin);
    for(let s=sMin;s+op.n-1<=ultimo;s++){const a=avaliar(op,s);if(a.ok){melhor=a;break;}}
    return {op,primeiro,melhor};
  });
  // recomendação: começo mais cedo; empate -> menor custo total -> menos parcelas
  const viaveis=linhas.filter(l=>l.melhor).map(l=>l.melhor);
  // começo mais cedo; depois menor custo total; depois mais folga no mês mais apertado
  viaveis.sort((a,b)=>a.s-b.s||a.op.total-b.op.total||b.pior-a.pior);
  const rec=viaveis[0]||null;
  // alternativa: a que termina mais rápido começando no mesmo mês
  const rapida=rec?viaveis.filter(v=>v.s===rec.s&&v.op.n<rec.op.n).sort((a,b)=>a.op.n-b.op.n)[0]||null:null;
  // capacidade de poupança: média do que sobra acima da margem nos meses projetados
  const sobras=livre.slice(1).map(l=>l-margem);
  const capacidade=sobras.length?sobras.reduce((t,v)=>t+v,0)/sobras.length:0;
  // cartão e janela de compra para a recomendação
  let janela=null;
  if(rec){
    const js=bancos.map(b=>({banco:b,...janelaCompra(b,rec.s)})).filter(j=>j.fim>=desde);
    js.forEach(j=>{if(j.ini<desde){j.ini=new Date(desde);j.dias=Math.round((j.venc-j.ini)/864e5);}});
    js.sort((a,b)=>b.dias-a.dias);janela=js[0]||null;
  }
  // linha "agora": a opção que o usuário mais provavelmente quer (maior parcelamento) começando já
  const pedida=linhas[linhas.length-1];
  const futura=desde>new Date();
  const naData=janela?(janela.ini-desde)<864e5:false;
  return {P,ords,comp,livre,margem,margemPct,valor,opcoes,linhas,rec,rapida,capacidade,janela,sMin,pedida,ultimo,futura,naData};
}

          <div class="fg"><label class="flabel">Valor à vista (R$)</label><input id="sim-valor" inputmode="decimal" placeholder="4.000,00" value="${escHtml(SIM.valor)}" oninput="SIM.valor=this.value"></div>

function calcularCompra(){
  SIM_RES=simular();desenharResultadoCompra();
  const r=document.getElementById('sim-res');if(r)r.scrollIntoView({behavior:'smooth',block:'start'});
}
function desenharResultadoCompra(){
  const out=document.getElementById('sim-res');if(!out)return;
  const R=SIM_RES;
  if(chartSim){chartSim.destroy();chartSim=null;}
  if(!R){out.innerHTML='';return;}
  if(R.erro){out.innerHTML=`<div class="sim-veredito warn"><div class="sim-v-t">⚠️ ${escHtml(R.erro)}</div></div>`;return;}
  const nome=escHtml(SIM.desc.trim()||'a compra');
  const P=R.P,rec=R.rec;
  const bancoNome=b=>b==='nu'?'Nubank':'C6';
  let html='';
  if(rec){
    const agora=rec.s===R.sMin||R.naData;
    const j=R.janela;
    const pts=[];
    if(j)pts.push(`Compre entre <b>${fmtDia(j.ini)}</b> e <b>${fmtDia(j.fim)}</b> no <b>${bancoNome(j.banco)}</b>: a ${rec.op.n>1?'1ª parcela':'cobrança'} só vence em <b>${fmtDia(j.venc)}</b> (~${j.dias} dias depois).`);
    pts.push(`${rec.op.n>1?`Parcela de <b>${fmt(rec.op.parcela)}</b> de ${rotuloMes(rec.s)} a ${rotuloMes(rec.s+rec.op.n-1)}.`:`Valor de <b>${fmt(rec.op.total)}</b> entra na fatura de lançamentos de ${rotuloMes(rec.s)}.`}`);
    pts.push(`O mês mais apertado fica com <b>${fmt(rec.pior)}</b> livres (${rotuloMes(rec.piorOrd)}), acima da sua sobra mínima de ${fmt(R.margem)}.`);
    // alívio que abre espaço, se houver
    const idx=R.ords.indexOf(rec.s);
    if(idx>=2&&R.comp[idx]<R.comp[idx-1]-1)pts.push(`Em ${rotuloMes(rec.s)} parcelas antigas terminam e liberam ${fmt(R.comp[idx-1]-R.comp[idx])}/mês. Isso abre espaço para a compra.`);
    if(R.rapida)pts.push(`Se preferir terminar antes: <b>${R.rapida.op.rot}</b> (${fmt(R.rapida.op.parcela)}/mês) também cabe. O mês mais apertado ficaria com ${fmt(R.rapida.pior)}.`);
    if(rec.s!==R.sMin){
      const p=R.linhas.find(l=>l.op.id===rec.op.id).primeiro;
      pts.push(`Se a compra cair já nos lançamentos de ${rotuloMes(R.sMin)}, ${rotuloMes(p.piorOrd)} ficaria com só <b>${fmt(p.pior)}</b> livres.`);
    }
    const parcelado=R.opcoes.filter(o=>o.n>1);
    if(parcelado.length&&parcelado[parcelado.length-1].total>R.valor+0.5){
      const o=parcelado[parcelado.length-1];pts.push(`Parcelado você paga <b>${fmt(o.total)}</b>: ${fmt(o.total-R.valor)} a mais (${((o.total/R.valor-1)*100).toFixed(1).replace('.',',')}%) que à vista.`);
    }
    html+=`<div class="sim-veredito ${agora?'ok':'wait'}">
      <div class="sim-v-t">${agora?(R.futura?'✅ Dá pra comprar na data que você quer':'✅ Dá pra comprar já'):'⏳ Melhor esperar um pouco'}</div>
      <div class="sim-v-s">Recomendação para ${nome}: <b>${rec.op.rot}</b>, com início em <b>${rotuloMes(rec.s)}</b>${R.janela?` no ${bancoNome(R.janela.banco)}`:''}.</div>
      <ul>${pts.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>`;
  }else{
    const meses=R.ultimo-R.sMin+1;
    html+=`<div class="sim-veredito no">
      <div class="sim-v-t">❌ Não recomendo nos próximos ${meses} meses</div>
      <div class="sim-v-s">Nenhuma forma de pagamento mantém a sobra mínima de ${fmt(R.margem)} por mês.</div>
      <ul>${R.capacidade>0?`<li>Sua sobra acima da margem é de cerca de <b>${fmt(R.capacidade)}/mês</b>. Guardando isso, você juntaria o valor à vista em <b>~${Math.ceil(R.valor/R.capacidade)} meses</b>.</li>`:`<li>Nos próximos meses não há sobra acima da margem para guardar.</li>`}<li>Você também pode baixar a sobra mínima para ver um cenário mais apertado.</li></ul>
    </div>`;
  }
  // comparativo
  const linhasTab=R.linhas.filter((l,i,arr)=>l.op.n===1||l.op.n===arr[arr.length-1].op.n||l.op.n%3===0||(rec&&l.op.id===rec.op.id));
  html+=`<div class="chart-card"><div class="chart-title">Comparando formas de pagamento</div>
    <div class="sim-tab"><div class="sim-tr sim-th"><span>Forma</span><span>Pode começar</span><span>Mês mais apertado</span></div>
    ${linhasTab.map(l=>{const m=l.melhor;const isRec=rec&&l.op.id===rec.op.id;
      return `<div class="sim-tr${isRec?' rec':''}"><span>${l.op.rot}${isRec?' ⭐':''}<small>${l.op.n>1?fmt(l.op.parcela)+'/mês':''}${l.op.total>R.valor+0.5?' · total '+fmt(l.op.total):''}</small></span><span>${m?rotuloMes(m.s):'—'}</span><span class="${m&&m.pior<R.margem*1.5?'apertado':''}">${m?fmt(m.pior):'não cabe'}</span></div>`;}).join('')}
    </div></div>`;
  // gráfico
  const alvo=rec||R.linhas[R.linhas.length-1].primeiro;
  html+=`<div class="chart-card"><div class="chart-title">${rec?'Seus meses com a compra recomendada':'Seus meses se comprar agora'}</div>
    <div class="chart-wrap" style="height:220px"><canvas id="chart-sim" aria-label="Gastos comprometidos por mês com a compra simulada"></canvas></div>
    <div class="proj-legend"><span><i style="background:${SIM_CORES.base}"></i>Já comprometido</span><span><i style="background:${SIM_CORES.nova}"></i>${nome==='a compra'?'Nova compra':nome}</span><span><i class="dash"></i>Entradas (${fmt(P.entrada)})</span></div>
    <div class="sim-hint" style="margin-top:10px">Simulação apenas: nada foi lançado. Se decidir comprar, lance normalmente pelo botão +.</div>
  </div>`;
  out.innerHTML=html;
  const ctx=document.getElementById('chart-sim');
  if(ctx&&typeof Chart!=='undefined'){
    const labels=R.ords.map(rotuloMes);const SURF=cssVar('--surface');
    chartSim=new Chart(ctx,{data:{labels,datasets:[
      {type:'bar',label:'Já comprometido',data:R.comp,backgroundColor:SIM_CORES.base,borderColor:SURF,borderWidth:{top:2,bottom:0,left:0,right:0},borderSkipped:false,stack:'s',maxBarThickness:26},
      {type:'bar',label:SIM.desc.trim()||'Nova compra',data:alvo.nova,backgroundColor:SIM_CORES.nova,borderColor:SURF,borderWidth:{top:2,bottom:0,left:0,right:0},borderSkipped:false,borderRadius:{topLeft:4,topRight:4},stack:'s',maxBarThickness:26},
      {type:'line',label:'Entradas',data:labels.map(()=>P.entrada),borderColor:cssVar('--text2'),borderWidth:2,borderDash:[6,5],pointRadius:0,pointHoverRadius:0,fill:false,order:-1}
    ]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:500},interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:cssVar('--elev'),borderColor:cssVar('--border'),borderWidth:1,titleColor:cssVar('--text'),bodyColor:cssVar('--text2'),footerColor:cssVar('--text'),padding:10,
        filter:i=>i.dataset.label!=='Entradas'&&!(i.dataset.type==='bar'&&i.raw===0&&i.datasetIndex===1),
        callbacks:{label:i=>` ${i.dataset.label}: ${fmt(i.raw)}`,footer:it=>{const k=it[0].dataIndex;const l=P.entrada-R.comp[k]-alvo.nova[k];return `Livre: ${fmt(l)}`;}}}},
      scales:{x:{stacked:true,grid:{display:false},ticks:{color:cssVar('--text2'),font:{size:10},maxRotation:0,autoSkip:true}},
        y:{stacked:true,beginAtZero:true,grid:{color:cssVar('--grid')},border:{display:false},ticks:{color:cssVar('--text3'),font:{size:10},maxTicksLimit:5,callback:v=>'R$'+(v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k':v)}}}}});
  }
}

// -- BUSCA GLOBAL (todos os meses) --
// Só lê os dados: não altera nada nem salva na nuvem.
const BUSCA_ORIGENS={
  mnu:{pessoa:'marcio',tipo:'nu',  rot:'Márcio · Nubank'},
  mc6:{pessoa:'marcio',tipo:'c6',  rot:'Márcio · C6'},
  fix:{pessoa:'marcio',tipo:'fix', rot:'Márcio · Fixos'},
  entradas:{pessoa:'marcio',tipo:'ent',rot:'Márcio · Entrada'},
  rnu:{pessoa:'raissa',tipo:'nu',  rot:'Raíssa · Nubank'},
  rc6:{pessoa:'raissa',tipo:'c6',  rot:'Raíssa · C6'}
};
const MESES_IDX=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let BUSCA={q:'',pessoa:'todos',tipo:'todos',cat:'',periodo:'tudo'};
let _buscaTimer=null;
function semAcento(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mesOrdinal(nome){const [m,a]=semAcento(nome).split(' ');const i=MESES_IDX.indexOf(m);return i<0||!a?null:(+a)*12+i;}
function abrirBusca(){goTab('busca');setTimeout(()=>{const i=document.getElementById('busca-q');if(i)i.focus();},60);}
function buscaSet(campo,valor){BUSCA[campo]=valor;renderBusca();}

function buscaResultados(){
  const termos=semAcento(BUSCA.q).split(/\s+/).filter(Boolean);
  const hoje=new Date(),ordHoje=hoje.getFullYear()*12+hoje.getMonth();
  const res=[];
  G.months.forEach((mo,mi)=>{
    const ord=mesOrdinal(mo.name);
    if(BUSCA.periodo==='mes'&&mi!==G.current)return;
    if(BUSCA.periodo==='ano'&&(ord===null||Math.floor(ord/12)!==hoje.getFullYear()))return;
    if(BUSCA.periodo==='3m'&&(ord===null||ord>ordHoje||ord<ordHoje-2))return;
    Object.keys(BUSCA_ORIGENS).forEach(key=>{
      const o=BUSCA_ORIGENS[key];
      if(BUSCA.pessoa!=='todos'&&o.pessoa!==BUSCA.pessoa)return;
      if(BUSCA.tipo!=='todos'&&o.tipo!==BUSCA.tipo)return;
      (mo[key]||[]).forEach((it,idx)=>{
        if(BUSCA.cat&&(it.cat||'outros')!==BUSCA.cat)return;
        if(termos.length){
          const alvo=semAcento(it.desc+' '+fmtS(it.val)+' '+(it.cat?catByID(it.cat).label:''));
          if(!termos.every(t=>alvo.includes(t)))return;
        }
        res.push({mi,key,idx,it,ord});
      });
    });
  });
  return res;
}

function buscaSugestoes(){
  const cont={};
  G.months.forEach(mo=>['mnu','mc6','rnu','rc6','fix'].forEach(k=>(mo[k]||[]).forEach(it=>{
    const d=descDisplay(it.desc||'').trim();if(d.length<3)return;cont[d]=(cont[d]||0)+1;
  })));
  return Object.entries(cont).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([d])=>d);
}

function irParaResultado(mi,key,desc){
  G.current=mi;updateLabel();
  const termo=descDisplay(desc||'');
  window._mantemFiltro=true;
  if(key==='mnu'||key==='mc6'||key==='fix'){marcioCard=key;marcioSearch=termo;goTab('marcio');}
  else if(key==='rnu'||key==='rc6'){raissaCard=key;raissaSearch=termo;goTab('raissa');}
  else goTab('entradas');
}

    <div class="bchips">${chip('periodo','tudo','Todo o período')}${chip('periodo','mes','Mês aberto')}${chip('periodo','ano','Este ano')}${chip('periodo','3m','Últimos 3 meses')}</div>
    <div class="bchips">
      <select class="bselect${BUSCA.cat?' on':''}" onchange="buscaSet('cat',this.value)">
        <option value="">Todas as categorias</option>
        ${CATS.map(c=>`<option value="${c.id}"${BUSCA.cat===c.id?' selected':''}>${c.emoji} ${c.label}</option>`).join('')}
      </select>
    </div>`;

  const out=document.getElementById('busca-res');
  const filtrosPadrao=BUSCA.pessoa==='todos'&&BUSCA.tipo==='todos'&&!BUSCA.cat&&BUSCA.periodo==='tudo';
  if(!BUSCA.q.trim()&&filtrosPadrao){
    const sug=buscaSugestoes();
    out.innerHTML=`<div class="busca-vazio">
      <div class="busca-vazio-ic">🔎</div>
      <div>Digite um nome ou valor para procurar em <b>todos os ${G.months.length} meses</b>.</div>
      ${sug.length?`<div class="busca-sug-t">Buscas rápidas</div><div class="bchips center">${sug.map(s=>`<button class="bchip" onclick="BUSCA.q=this.dataset.q;renderBusca()" data-q="${escHtml(s)}">${escHtml(s)}</button>`).join('')}</div>`:''}
    </div>`;
    return;
  }

  const res=buscaResultados();
  if(!res.length){out.innerHTML=`<div class="busca-vazio"><div class="busca-vazio-ic">🤷</div><div>Nada encontrado${BUSCA.q?` para "<b>${escHtml(BUSCA.q)}</b>"`:''}.</div></div>`;return;}

  const gastos=res.filter(r=>r.key!=='entradas'),ents=res.filter(r=>r.key==='entradas');
  const totG=gastos.reduce((t,r)=>t+(+r.it.val||0),0),totE=ents.reduce((t,r)=>t+(+r.it.val||0),0);
  const mesesComGasto=new Set(gastos.map(r=>r.mi)).size;
  const titulo=BUSCA.q.trim()?escHtml(BUSCA.q.trim()):'Resultado';
  let html=`<div class="busca-resumo">
    <div class="busca-resumo-t">${titulo}</div>
    <div class="busca-resumo-n">${res.length} lançamento${res.length>1?'s':''} em ${new Set(res.map(r=>r.mi)).size} ${new Set(res.map(r=>r.mi)).size>1?'meses':'mês'}</div>
    <div class="busca-resumo-grid">
      ${gastos.length?`<div><span>Total gasto</span><b>${fmt(totG)}</b></div><div><span>Média por mês</span><b>${fmt(totG/(mesesComGasto||1))}</b></div>`:''}
      ${ents.length?`<div><span>Total de entradas</span><b class="pos">${fmt(totE)}</b></div>`:''}
    </div>
  </div>`;

  const porMes={};res.forEach(r=>{(porMes[r.mi]=porMes[r.mi]||[]).push(r);});
  const LIM=400;let mostrados=0;
  Object.keys(porMes).map(Number).sort((a,b)=>b-a).forEach(mi=>{
    if(mostrados>=LIM)return;
    const lista=porMes[mi];
    const sub=lista.filter(r=>r.key!=='entradas').reduce((t,r)=>t+(+r.it.val||0),0);
    html+=`<div class="list-card busca-grupo"><div class="list-head"><div class="list-title">📅 ${escHtml(G.months[mi].name)}${mi===G.current?' <span class="pill pill-nu">mês aberto</span>':''}</div><div class="busca-sub">${sub?fmt(sub):''}</div></div>`;
    lista.forEach(r=>{
      if(mostrados++>=LIM)return;
      const it=r.it,o=BUSCA_ORIGENS[r.key],c=it.cat?catByID(it.cat):null;
      const pm=String(it.desc||'').match(/(\d+)-(\d+)\s*$/);
      html+=`<button class="item busca-item" onclick="irParaResultado(${r.mi},'${r.key}',this.dataset.d)" data-d="${escHtml(it.desc)}">
        <div class="item-icon" style="background:${keyBg(r.key)};overflow:hidden">${keyIcon(r.key)}</div>
        <div class="item-body">
          <div class="item-desc">${escHtml(descDisplay(it.desc||''))}${pm?` <span class="busca-parc">${pm[1]}/${pm[2]}</span>`:''}</div>
          <div class="busca-meta">${o.rot}${it.data?' · '+escHtml(it.data):''}${c?` · <span style="color:${c.color}">${c.emoji} ${c.label}</span>`:''}</div>
        </div>
        <span class="item-val${r.key==='entradas'?' pos':''}">${fmt(it.val)}</span>
      </button>`;
    });
    html+=`</div>`;
  });
  if(res.length>LIM)html+=`<div class="busca-vazio" style="padding:12px">Mostrando ${LIM} de ${res.length}. Refine a busca para ver o resto.</div>`;
  out.innerHTML=html;
}

// -- APP INSTALÁVEL (PWA) --
let _promptInstalar=null;
const _ehIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const _jaInstalado=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function _mostrarBotaoInstalar(v){const b=document.getElementById('btn-instalar');if(b)b.hidden=!v;}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_promptInstalar=e;_mostrarBotaoInstalar(true);});
window.addEventListener('appinstalled',()=>{_promptInstalar=null;_mostrarBotaoInstalar(false);showSyncStatus('📲 App instalado!',true);});
if(_ehIOS&&!_jaInstalado())_mostrarBotaoInstalar(true);
async function instalarApp(){
  closeMore();
  if(_promptInstalar){_promptInstalar.prompt();await _promptInstalar.userChoice;_promptInstalar=null;_mostrarBotaoInstalar(false);return;}
  if(_ehIOS){
    let tip=document.getElementById('ios-tip');
    if(!tip){tip=document.createElement('div');tip.id='ios-tip';tip.className='ios-tip';document.body.appendChild(tip);}
    tip.innerHTML='<b>Instalar no iPhone:</b><br>No Safari, toque em <b>Compartilhar</b> (quadrado com seta ↑) e depois em <b>Adicionar à Tela de Início</b>.<button onclick="this.parentNode.remove()" aria-label="Fechar">×</button>';
  }
}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
