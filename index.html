*{box-sizing:border-box;margin:0;padding:0}
:root{
  --nu:#a78bfa;--nu-bg:#1e1433;--nu-txt:#c4b5fd;
  --c6:#79c0ff;--c6-bg:#0d1b2e;--c6-txt:#79c0ff;
  --fix:#4ade80;--fix-bg:#0a1f0a;--fix-txt:#4ade80;
  --rai:#f472b6;--rai-bg:#1a0a12;--rai-txt:#fbcfe8;
  --in:#4ade80;--in-bg:#0a1f0a;
  --danger:#f87171;--danger-bg:#1f0a0a;
  --bg:#0d1117;--surface:#161b22;--surface2:#0d1117;--border:#30363d;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --radius:14px;--shadow:0 1px 3px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.4);
  --elev:#1f2430;--chrome:rgba(9,13,19,.82);--nav:rgba(15,17,26,.88);--grid:rgba(255,255,255,.06);
  --ink-rgb:255,255,255;
  --pos:#4ade80;--neg:#f87171;--neg-soft:#fca5a5;--accent-txt:#c4b5fd;--blue-txt:#93c5fd;--warn:#fbbf24;--rai-soft:#fbcfe8;
  --k-nu:#2d1f5e;--k-c6:#1a1a1a;--k-rnu:#3b0f40;--ok-bg:#14532d;--bad-bg:#450a0a;--chip-bg:#1e293b;--rec-a:#1e1530;--rec-b:#1a1a24;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --nu:#7c5ce6;--nu-bg:#efe9ff;--nu-txt:#5b3fc4;
  --c6:#2f7fd1;--c6-bg:#e6f0fb;--c6-txt:#1d5fa8;
  --fix:#16a34a;--fix-bg:#e6f6ea;--fix-txt:#167a3a;
  --rai:#db2777;--rai-bg:#fdeef5;--rai-txt:#a3245f;
  --in:#15803d;--in-bg:#e7f6ec;
  --danger:#c62828;--danger-bg:#fdecec;
  --bg:#f3f4f8;--surface:#ffffff;--surface2:#f7f8fb;--border:#e2e4ec;
  --text:#161a23;--text2:#555d6e;--text3:#7c8394;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --elev:#ffffff;--chrome:rgba(255,255,255,.86);--nav:rgba(255,255,255,.94);--grid:rgba(22,26,35,.08);
  --ink-rgb:22,26,35;
  --pos:#15803d;--neg:#c62828;--neg-soft:#b91c1c;--accent-txt:#5b3fc4;--blue-txt:#1d5fa8;--warn:#b45309;--rai-soft:#a3245f;
  --k-nu:#efe9ff;--k-c6:#ececef;--k-rnu:#fde7f1;--ok-bg:#e3f5e9;--bad-bg:#fde8e8;--chip-bg:#eef1f6;--rec-a:#f5f0ff;--rec-b:#ffffff;
  color-scheme:light;
}
/* Cartões coloridos ("ilhas") mantêm texto claro nos dois temas */
.hero,.fatura-card,.busca-resumo,[style*="--island"]{
  --ink-rgb:255,255,255;--text:#fff;--text2:rgba(255,255,255,.72);--text3:rgba(255,255,255,.5);--border:rgba(255,255,255,.15);
  --pos:#4ade80;--neg:#f87171;--neg-soft:#fca5a5;--accent-txt:#c4b5fd;--blue-txt:#93c5fd;--warn:#fbbf24;--rai-soft:#fbcfe8;--in:#4ade80;
  color:#fff;
}
/* Ajustes finos do tema claro */
:root[data-theme="light"] .topbar{border-bottom-color:var(--border)}
:root[data-theme="light"] .app-title-main{background:linear-gradient(90deg,#6d28d9,#2563eb);-webkit-background-clip:text;background-clip:text}
:root[data-theme="light"] .add-btn .fab{box-shadow:0 8px 22px rgba(99,102,241,.35),0 0 0 5px var(--bg)}
:root[data-theme="light"] .month-label{color:var(--text)}
:root[data-theme="light"] .month-btn{color:var(--text2)}
:root[data-theme="light"] .more-backdrop{background:rgba(15,23,42,.35)}
:root[data-theme="light"] .key-modal-bg{background:rgba(15,23,42,.45)}
:root[data-theme="light"] .conf-item.conf-ok{background:#ecfdf3}
:root[data-theme="light"] .conf-item.conf-div{background:#fef2f2}
:root[data-theme="light"] .conf-check{color:var(--text)}
:root[data-theme="light"] .conf-check.ok{color:#15803d;border-color:#16a34a}
:root[data-theme="light"] .conf-check.div{color:#c62828;border-color:#dc2626}
:root[data-theme="light"] .bchip.on{color:var(--accent-txt)}
:root[data-theme="light"] .filtro-chip{color:var(--accent-txt)}
:root[data-theme="light"] .proj-fim-mes{color:var(--accent-txt)}
:root[data-theme="light"] .sim-veredito.ok{background:#ecfdf3;border-color:#86efac}
:root[data-theme="light"] .sim-veredito.wait{background:#fffbeb;border-color:#fcd34d}
:root[data-theme="light"] .sim-veredito.no,:root[data-theme="light"] .sim-veredito.warn{background:#fef2f2;border-color:#fca5a5}
:root[data-theme="light"] .top-search-btn{color:var(--accent-txt);background:var(--surface);border-color:var(--border)}
:root[data-theme="light"] .month-switcher{background:var(--surface);border-color:var(--border)}

html,body{background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.app{max-width:960px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:90px}

/* HEADER */
.topbar{position:sticky;top:0;z-index:90;background:var(--chrome);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid rgba(139,92,246,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.6) 30%,rgba(96,165,250,.6) 70%,transparent)}
.topbar-row{display:flex;align-items:center;justify-content:space-between}
.app-title{display:flex;flex-direction:column;gap:1px}
.app-title-main{font-size:18px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;background:linear-gradient(90deg,var(--accent-txt),var(--blue-txt));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.app-title-sub{font-size:9px;font-weight:600;color:rgba(var(--ink-rgb),.35);letter-spacing:1.4px;text-transform:uppercase}
.month-switcher{display:flex;align-items:center;gap:8px;background:rgba(var(--ink-rgb),.06);border-radius:24px;padding:5px 10px;border:1px solid rgba(139,92,246,.25)}
.month-btn{background:none;border:none;cursor:pointer;color:rgba(var(--ink-rgb),.6);font-size:20px;line-height:1;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.month-label{font-size:13px;font-weight:600;color:#fff;min-width:88px;text-align:center;white-space:nowrap}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:960px;background:var(--elev);border-top:1px solid var(--border);display:flex;z-index:100;padding:6px 4px 8px;box-shadow:0 -4px 20px rgba(0,0,0,.4)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border:none;background:none;cursor:pointer;color:var(--text3);font-size:10px;font-weight:500;font-family:'Plus Jakarta Sans',sans-serif}
.bnav-btn .bicon{font-size:22px;line-height:1}.bnav-btn .bicon-wrap-icon{font-size:20px;color:#fff}
.bnav-btn.active{color:var(--nu)}
.bnav-btn.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:32px;height:3px;background:var(--nu);border-radius:0 0 4px 4px}
.bnav-btn{position:relative}
.add-btn .bicon-wrap-icon{background:linear-gradient(135deg,#388bfd,#1d4ed8);border-radius:14px;width:44px;height:32px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 12px rgba(56,139,253,.4)}
.add-btn{color:#fff!important}

/* CONTENT */
.content{padding:16px 16px 8px}
.page{display:none}.page.active{display:block}
.page-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:16px;letter-spacing:-.4px}

/* HERO */
.hero{background:linear-gradient(135deg,#1e1b4b,#4c1d95);border-radius:var(--radius);padding:22px;margin-bottom:14px;position:relative;overflow:hidden}
.hero-label{font-size:11px;font-weight:600;color:rgba(var(--ink-rgb),.6);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.hero-val{font-size:36px;font-weight:700;line-height:1;margin-bottom:6px;color:#fff;letter-spacing:-1px}
.hero-val.neg{color:var(--neg-soft)}
.hero-sub{font-size:12px;color:rgba(var(--ink-rgb),.55)}
.hero-divider{height:1px;background:rgba(var(--ink-rgb),.15);margin:16px 0}
.hero-row{display:flex;justify-content:space-between}
.hero-stat{text-align:center;flex:1;position:relative;z-index:1}
.hero-stat-val{font-size:15px;font-weight:600;color:#fff}
.hero-stat-lbl{font-size:11px;color:rgba(var(--ink-rgb),.5);margin-top:3px}
.hero-stat+.hero-stat{border-left:1px solid rgba(var(--ink-rgb),.15)}

/* FATURA CARDS */
.fatura-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.fatura-card{border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.fatura-card-nu{background:linear-gradient(135deg,#2d1f5e,#1e1b4b);border-color:#4c1d95}
.fatura-card-c6{background:linear-gradient(135deg,#1e3a5f,#0f172a);border-color:#1e40af}
.fatura-bank-label{font-size:11px;font-weight:700;color:rgba(var(--ink-rgb),.5);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.fatura-total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.fatura-total-label{font-size:11px;color:rgba(var(--ink-rgb),.5)}
.fatura-total-val{font-size:20px;font-weight:700;color:#fff}
.fatura-liquido-row{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid rgba(var(--ink-rgb),.1)}
.fatura-liquido-label{font-size:11px;color:rgba(var(--ink-rgb),.45)}
.fatura-liquido-val{font-size:14px;font-weight:700;color:var(--pos)}
.fatura-reembolso-val{font-size:11px;color:rgba(var(--ink-rgb),.35);margin-top:3px}
.fatura-detail{display:flex;justify-content:space-between;font-size:11px;color:rgba(var(--ink-rgb),.4);margin-bottom:3px}

/* METRIC GRID */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}@media(min-width:600px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mcard{background:var(--surface);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.mcard-label{font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:500;display:flex;align-items:center;gap:5px}
.mcard-val{font-size:20px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
.mcard-sub{font-size:11px;color:var(--text3);margin-top:4px}

/* CHARTS */
.chart-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.chart-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px}
.chart-wrap{position:relative;height:170px}
canvas{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}

/* CAT BARS */
.catbar{margin-bottom:12px}
.catbar-info{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.catbar-name{font-size:12px;color:var(--text2);font-weight:500}
.catbar-vals{font-size:12px;font-weight:600;color:var(--text)}
.catbar-pct{font-size:11px;color:var(--text3);margin-left:4px}
.track{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.fill{height:7px;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* LIST */
.list-card{background:var(--surface);border-radius:var(--radius);overflow:visible;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.list-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.list-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text)}
.pill{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600}
.pill-nu{background:var(--nu-bg);color:var(--nu-txt)}
.pill-c6{background:var(--c6-bg);color:var(--c6-txt)}
.pill-fix{background:var(--fix-bg);color:var(--fix-txt)}
.pill-in{background:var(--in-bg);color:var(--in)}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);overflow:visible}
.item:last-child{border-bottom:none}
.item-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 36px;font-size:16px}
.item-body{flex:1;min-width:0;overflow:hidden}
.item-desc{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.item-date{font-size:11px;color:var(--text3);margin-top:2px}
.item-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.item-val{font-size:13px;font-weight:600;color:var(--text)}
.item-val.pos{color:var(--in)}
.item-actions{display:flex;gap:5px;flex:0 0 auto}
.act-btn{border:none;cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 32px}
.act-btn.edit{background:var(--c6-bg)}
.act-btn.del{background:var(--danger-bg)}
.list-foot{padding:12px 16px;background:var(--surface2);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius)}
.foot-lbl{font-size:12px;color:var(--text2);font-weight:500}
.foot-val{font-size:15px;font-weight:700;color:var(--text)}
.empty{padding:28px 16px;text-align:center;font-size:13px;color:var(--text3)}

/* EDIT ROW */
.edit-row{display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.edit-row input{flex:1;min-width:80px;padding:8px 10px;font-size:13px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif}
.edit-row input.val-inp{width:90px;flex:0 0 90px}
.btn-ok{background:var(--nu);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.btn-cancel{background:none;border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;color:var(--text2);font-family:'Plus Jakarta Sans',sans-serif}

/* FORM */
.form-card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.form-section{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:14px}
.fg{margin-bottom:14px}
.flabel{font-size:12px;color:var(--text2);display:block;margin-bottom:6px;font-weight:500}
input,select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-size:14px;font-family:'Plus Jakarta Sans',sans-serif}
input:focus,select:focus{outline:none;border-color:var(--nu)}
select option{background:var(--surface2);color:var(--text)}
.row2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.btn-submit{width:100%;padding:13px;background:linear-gradient(135deg,var(--nu),var(--c6));color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:6px;box-shadow:0 4px 14px rgba(124,58,237,.35)}
.toast{font-size:12px;color:var(--in);background:var(--in-bg);border-radius:10px;padding:10px 14px;text-align:center;margin-top:12px;display:none;font-weight:500}
.parc-preview{background:var(--nu-bg);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--nu-txt);font-weight:500;display:none}

/* DIVISÃO */
.divisao-box{background:linear-gradient(135deg,#1e3a5f22,#2d1f5e22);border:1.5px solid #4c1d95;border-radius:12px;padding:14px;margin-bottom:14px;display:none}
.divisao-box.active{display:block}
.divisao-title{font-size:12px;font-weight:700;color:var(--nu-txt);margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* CARD SELECTOR */
.card-selector{display:flex;gap:10px;margin-bottom:14px}
.csel-btn{flex:1;padding:12px 8px;border-radius:14px;border:2px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow)}
.csel-btn.active{border-color:transparent;color:#fff}
.csel-btn .csel-icon{font-size:20px}
.csel-btn .csel-val{font-size:11px;opacity:.85}

/* MONTH MGR */
.month-mgr{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.month-list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.month-list-item:last-child{border-bottom:none}
.month-name{font-size:14px;color:var(--text);font-weight:500}
.month-stats{font-size:11px;color:var(--text3);margin-top:2px}
.btn-month-sel{background:var(--nu);color:#fff;border:none;border-radius:10px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.btn-month-sel.current{background:var(--nu-bg);color:var(--nu-txt)}
.btn-new-month{width:100%;padding:12px;border:2px dashed var(--border);border-radius:12px;background:transparent;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}

/* ACTION MENU */
.action-menu-wrap{position:relative;flex:0 0 auto}
.action-menu-btn{background:var(--surface2);border:1px solid var(--border);cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text2);font-family:'Plus Jakarta Sans',sans-serif}
.action-menu{display:none;position:absolute;right:0;top:36px;background:var(--elev);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:999;min-width:140px;overflow:hidden}
.action-menu.open{display:block}
.action-menu-item{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;border:none;background:none;width:100%;text-align:left}
.action-menu-item:hover{background:var(--surface2)}
.action-menu-item.danger{color:var(--danger)}
.action-menu-item.danger:hover{background:var(--danger-bg)}

/* CONFERÊNCIA */
.conf-bank-block{background:var(--surface);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.conf-bank-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface2)}
.conf-bank-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.conf-progress-bar{height:4px;background:var(--border);margin:0;overflow:hidden}
.conf-progress-fill{height:4px;background:linear-gradient(90deg,#16a34a,var(--pos));transition:width .4s}
.conf-item{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);transition:background .15s}
.conf-item:last-child{border-bottom:none}
.conf-item.conf-ok{background:#052e1688}
.conf-item.conf-div{background:#450a0a88}
.conf-check{width:30px;height:30px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex:0 0 30px;font-size:14px;cursor:pointer;background:var(--surface2);color:var(--text);transition:all .15s;font-weight:700}
.conf-check:hover{border-color:var(--nu)}
.conf-check.ok{background:var(--ok-bg);border-color:#16a34a;color:var(--pos)}
.conf-check.div{background:var(--bad-bg);border-color:#dc2626;color:var(--neg)}
.conf-person-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap;flex:0 0 auto}
.conf-badge-m{background:var(--k-nu);color:var(--accent-txt)}
.conf-badge-r{background:var(--k-rnu);color:var(--rai-soft)}
.conf-summary{padding:14px 16px;background:var(--surface2);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.conf-total-val{font-size:15px;font-weight:700;color:var(--text)}
.conf-total-lbl{font-size:11px;color:var(--text3)}

/* MOBILE RESPONSIVE */
@media (max-width: 480px){
  input,select,textarea{font-size:16px!important}
  .app-title{font-size:15px}
  .month-label{min-width:72px;font-size:12px}
  .month-btn{width:32px;height:32px;font-size:22px}
  .content{padding:12px 12px 8px}
  .page-title{font-size:18px;margin-bottom:12px}
  .bottom-nav{padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
  .bnav-btn{font-size:9px;padding:6px 2px;gap:2px;min-height:52px}
  .bnav-btn .bicon{font-size:22px}
  .add-btn .bicon-wrap{width:40px;height:30px;font-size:18px}
  .hero{padding:16px}
  .hero-val{font-size:28px}
  .hero-stat-val{font-size:13px}
  .hero-stat-lbl{font-size:10px}
  .mcard{padding:12px}
  .mcard-val{font-size:17px}
  .item{padding:12px 12px;gap:10px}
  .item-icon{width:32px;height:32px;flex:0 0 32px;font-size:15px}
  .item-desc{font-size:13px}
  .item-val{font-size:13px}
  .act-btn{width:36px;height:36px;font-size:18px;flex:0 0 36px}
  .item-actions{gap:6px}
  .edit-row{flex-wrap:wrap;gap:8px;padding:12px}
  .edit-row input{min-width:0}
  .edit-row input.val-inp{width:80px;flex:0 0 80px}
  .btn-ok{padding:10px 16px;font-size:13px}
  .btn-cancel{padding:10px 12px;font-size:13px}
  .form-card{padding:16px}
  .fg{margin-bottom:16px}
  .flabel{font-size:13px;margin-bottom:8px}
  .btn-submit{padding:15px;font-size:15px;border-radius:14px}
  .toast{font-size:13px;padding:12px}
  .row2{gap:8px}
  .csel-btn{padding:14px 8px}
  .csel-btn .csel-icon{font-size:22px}
  .csel-btn .csel-val{font-size:11px}
  .chart-wrap{height:150px}
  .mgrid{gap:8px}
  .list-head{padding:12px 14px}
  .list-title{font-size:13px}
  .list-foot{padding:10px 14px}
  .foot-val{font-size:14px}
  .month-mgr{padding:16px}
  .btn-month-sel{padding:8px 14px;font-size:13px}
  .btn-new-month{padding:14px;font-size:13px}
  .app{padding-bottom:80px}
  .fatura-grid{grid-template-columns:1fr}
  .fatura-card{padding:14px}
  .fatura-total-val{font-size:18px}
}

/* ===== REFINAMENTOS VISUAIS ===== */
.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(96,165,250,.28),transparent 55%),linear-gradient(140deg,#1e1b4b 0%,#3b1d7a 55%,#5b21b6 100%);border:1px solid rgba(167,139,250,.25);box-shadow:0 10px 30px rgba(76,29,149,.35)}
.hero-label{display:flex;align-items:center;gap:6px}
.hero-val{font-size:38px;font-weight:800;letter-spacing:-1.2px;margin:2px 0 6px}
.hero-flow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.flow{background:rgba(var(--ink-rgb),.07);border:1px solid rgba(var(--ink-rgb),.08);border-radius:12px;padding:10px 12px;min-width:0}
.flow-lbl{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:rgba(var(--ink-rgb),.55)}
.flow-in .flow-lbl svg{color:var(--pos)}.flow-out .flow-lbl svg{color:var(--neg)}
.flow-val{display:block;font-size:17px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-in .flow-val{color:var(--pos)}.flow-out .flow-val{color:var(--neg-soft)}
.hero-usage{margin-top:12px}
.hero-usage-track{height:6px;border-radius:6px;background:rgba(var(--ink-rgb),.12);overflow:hidden}
.hero-usage-fill{height:100%;border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hero-usage-lbl{font-size:11px;color:rgba(var(--ink-rgb),.55);margin-top:6px}
.hero-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
@media(min-width:640px){.hero-kpis{grid-template-columns:repeat(4,1fr)}.kpi-total{grid-column:1/-1}}
.kpi{background:rgba(0,0,0,.18);border:1px solid rgba(var(--ink-rgb),.07);border-radius:12px;padding:10px 12px;min-width:0}
.kpi-lbl{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(var(--ink-rgb),.6);font-weight:500;white-space:nowrap}
.kpi-val{font-size:16px;font-weight:700;color:#fff;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sub{display:flex;flex-wrap:wrap;align-items:center;gap:3px 4px;font-size:10px;color:rgba(var(--ink-rgb),.5);margin-top:4px;white-space:nowrap}.kpi-sub>*{flex-shrink:0}.kpi-pair{display:inline-flex;align-items:center;gap:4px;margin-right:6px}
.kpi-rai .kpi-val{color:var(--rai-soft)}
.kpi-total{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;background:rgba(165,180,252,.1);border-color:rgba(165,180,252,.2)}
.kpi-total .kpi-val{margin-top:0;color:#c7d2fe;font-size:18px}

/* Navegação inferior */
.bottom-nav{background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(var(--ink-rgb),.06);padding:6px 6px calc(8px + env(safe-area-inset-bottom));align-items:flex-end}
.bnav-btn{font-size:11px;gap:4px;padding:6px 2px;min-height:54px;justify-content:center;transition:color .2s,transform .15s}
.bnav-btn:active{transform:scale(.92)}
.bnav-btn.active::before{display:none}
.bnav-btn.active .ti-svg{background:rgba(167,139,250,.16);border-radius:14px;padding:3px 14px}
.bnav-btn .ti-svg{padding:3px 14px;transition:background .2s}
.add-btn .fab{width:54px;height:54px;border-radius:18px;margin-top:-26px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(99,102,241,.5),0 0 0 5px var(--bg);transition:transform .2s}
.add-btn .fab .ti-svg{padding:0!important;background:none!important;color:#fff}
.add-btn .fab svg{width:26px;height:26px}
.add-btn .fab svg{transition:transform .25s}.add-btn.active .fab svg{transform:rotate(45deg)}
.more-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:110}
.more-sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:960px;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:120;background:var(--surface);border:1px solid var(--border);border-bottom:none;border-radius:22px 22px 0 0;padding:10px 14px calc(20px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:10px;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.more-grip{grid-column:1/-1;width:40px;height:4px;border-radius:4px;background:var(--border);margin:0 auto 6px}
body.more-open .more-backdrop{opacity:1;pointer-events:auto}
body.more-open .more-sheet{transform:translate(-50%,0)}
.more-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;text-align:left;font-family:inherit;transition:border-color .2s,background .2s}
.more-item:active{transform:scale(.97)}
.more-item.active{border-color:var(--nu);background:rgba(167,139,250,.1)}
.more-ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:rgba(167,139,250,.14);color:var(--nu);display:flex;align-items:center;justify-content:center}
.more-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.more-txt b{font-size:14px;font-weight:700}
.more-install{grid-column:1/-1;border-color:rgba(167,139,250,.45);background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(59,130,246,.14))}
.more-install[hidden]{display:none}
.key-modal-bg{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;animation:pageIn .2s ease-out}
.key-modal{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center}
.key-modal-ic{font-size:30px;margin-bottom:6px}
.key-modal h3{font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px}
.key-modal p{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:16px}
.key-inp-wrap{position:relative;margin-bottom:14px}
.key-inp-wrap input{padding-right:46px}
.key-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:none;cursor:pointer;font-size:16px;opacity:.7}
.key-actions{display:flex;gap:8px}
.key-actions button{flex:1;padding:12px 10px;font-size:13px}
.top-search-btn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(139,92,246,.25);background:rgba(var(--ink-rgb),.06);color:var(--accent-txt);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 38px}
.top-search-btn.active{background:rgba(167,139,250,.2);border-color:var(--nu)}
.busca-box{position:relative;display:flex;align-items:center;margin-bottom:12px}
.busca-box>svg{position:absolute;left:14px;color:var(--text3);pointer-events:none}
.busca-box input{padding:13px 44px 13px 42px;border-radius:14px;font-size:15px;background:var(--surface)}
.busca-box input::-webkit-search-cancel-button{display:none}
.busca-clear{position:absolute;right:8px;width:32px;height:32px;border:none;border-radius:10px;background:rgba(var(--ink-rgb),.07);color:var(--text2);cursor:pointer;align-items:center;justify-content:center;font-size:13px}
.bchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;align-items:center}
.bchips::-webkit-scrollbar{display:none}
.bchips.center{flex-wrap:wrap;justify-content:center;overflow:visible}
.bchip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.bchip.on{background:rgba(167,139,250,.18);border-color:var(--nu);color:var(--accent-txt)}
.bselect{flex:1 1 auto;width:100%;padding:7px 12px;border-radius:999px;font-size:12px!important;font-weight:600;color:var(--text2);background:var(--surface)}
.bselect.on{border-color:var(--nu);color:var(--accent-txt)}
.proj-nota{font-size:11px;color:var(--text3);margin:-8px 0 12px;line-height:1.5}
.proj-kpis small b{display:inline;font-size:inherit}
.proj-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.proj-kpis>div{background:var(--bg);border:1px solid rgba(var(--ink-rgb),.06);border-radius:12px;padding:10px 12px;min-width:0}
.proj-kpis span{display:block;font-size:11px;color:var(--text2)}
.proj-kpis b{display:block;font-size:17px;color:var(--text);margin-top:3px;white-space:nowrap}
.proj-kpis b.neg{color:var(--neg-soft)}
.proj-kpis small{display:block;font-size:10px;color:var(--text3);margin-top:2px}
.proj-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11px;color:var(--text2)}
.proj-legend span{display:inline-flex;align-items:center;gap:6px}
.proj-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.proj-legend i.dash{width:16px;height:0;border-top:2px dashed var(--text2);border-radius:0}
.proj-fins-t{margin:18px 0 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3)}
.proj-fim{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(var(--ink-rgb),.06)}
.proj-fim-mes{flex:0 0 58px;font-size:12px;font-weight:700;color:var(--accent-txt);background:rgba(144,133,233,.14);border-radius:8px;text-align:center;padding:5px 0}
.proj-fim-body{min-width:0}
.proj-fim-nomes{font-size:13px;color:var(--text);font-weight:600}
.proj-fim-sub{font-size:11px;color:var(--text2);margin-top:2px}
.proj-fim-sub b{color:var(--text)}
.proj-mais summary{cursor:pointer;list-style:none;font-size:12px;font-weight:600;color:var(--accent-txt);padding:10px 0 2px;border-top:1px solid rgba(var(--ink-rgb),.06)}
.proj-mais summary::-webkit-details-marker{display:none}
.proj-mais[open] summary{display:none}
.more-wide{grid-column:1/-1}
.tema-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:4px}
.tema-btn{border:none;background:none;padding:10px 4px;border-radius:9px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit}
.tema-btn.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.more-wide .more-ic{font-size:20px}
.sim-hint{font-size:11px;color:var(--text3);margin:-6px 0 14px;line-height:1.5}
.sim-veredito{border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid}
.sim-veredito.ok{background:rgba(22,163,74,.12);border-color:rgba(74,222,128,.4)}
.sim-veredito.wait{background:rgba(234,179,8,.10);border-color:rgba(250,204,21,.4)}
.sim-veredito.no,.sim-veredito.warn{background:rgba(220,38,38,.10);border-color:rgba(248,113,113,.4)}
.sim-v-t{font-size:17px;font-weight:800;color:var(--text)}
.sim-v-s{font-size:13px;color:var(--text);margin-top:6px;line-height:1.5}
.sim-veredito ul{margin:10px 0 0 18px;display:flex;flex-direction:column;gap:6px}
.sim-veredito li{font-size:12.5px;color:var(--text2);line-height:1.5}
.sim-veredito li b{color:var(--text)}
.sim-tab{display:flex;flex-direction:column}
.sim-tr{display:grid;grid-template-columns:1.4fr .9fr 1fr;gap:8px;padding:10px 4px;border-top:1px solid rgba(var(--ink-rgb),.06);font-size:13px;color:var(--text);align-items:center}
.sim-tr span:not(:first-child){text-align:right}
.sim-tr small{display:block;font-size:10px;color:var(--text3);margin-top:2px}
.sim-th{border-top:none;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;padding-top:0}
.sim-tr.rec{background:rgba(144,133,233,.10);border-radius:10px;border-top-color:transparent}
.sim-tr .apertado{color:var(--warn)}
.filtro-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;padding:8px 8px 8px 14px;border-radius:12px;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4);font-size:13px;color:var(--accent-txt)}
.filtro-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filtro-chip button{flex:0 0 auto;width:30px;height:30px;border:none;border-radius:9px;background:rgba(var(--ink-rgb),.08);color:var(--text);cursor:pointer;font-size:13px}
.busca-vazio{text-align:center;color:var(--text2);font-size:13px;line-height:1.6;padding:36px 12px}
.busca-vazio-ic{font-size:34px;margin-bottom:8px}
.busca-sug-t{margin:22px 0 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3)}
.busca-resumo{margin:6px 0 14px;padding:16px;border-radius:var(--radius);background:linear-gradient(140deg,#1e1b4b,#3b1d7a);border:1px solid rgba(167,139,250,.25)}
.busca-resumo-t{font-size:18px;font-weight:800;color:#fff;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.busca-resumo-n{font-size:12px;color:rgba(var(--ink-rgb),.6);margin-top:2px}
.busca-resumo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.busca-resumo-grid>div{background:rgba(0,0,0,.2);border-radius:12px;padding:10px 12px}
.busca-resumo-grid span{display:block;font-size:11px;color:rgba(var(--ink-rgb),.55)}
.busca-resumo-grid b{display:block;font-size:17px;color:#fff;margin-top:3px;white-space:nowrap}
.busca-resumo-grid b.pos{color:var(--pos)}
.busca-sub{font-size:13px;font-weight:700;color:var(--text)}
.busca-item{width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--border);font-family:inherit;cursor:pointer;color:inherit}
.busca-item:last-child{border-bottom:none}
.busca-item:hover{background:rgba(var(--ink-rgb),.03)}
.busca-meta{font-size:11px;color:var(--text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.busca-parc{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(var(--ink-rgb),.08);color:var(--text2);margin-left:4px}
@media (max-width:420px){.app-title-sub{display:none}.month-switcher{padding:5px 6px;gap:4px}.month-label{min-width:76px}}
.ios-tip{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;z-index:9999;background:var(--elev);border:1px solid rgba(167,139,250,.45);border-radius:16px;padding:14px 40px 14px 16px;color:var(--text);font-size:13px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ios-tip button{position:absolute;top:8px;right:8px;width:28px;height:28px;border:none;border-radius:8px;background:rgba(var(--ink-rgb),.08);color:var(--text2);font-size:16px;cursor:pointer}
.more-txt small{font-size:11px;color:var(--text2);line-height:1.3}

/* Microinterações */
.page.active{animation:pageIn .28s ease-out}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{transition:transform .12s,filter .15s}
.btn-submit:active,.btn-ok:active,.csel-btn:active,.btn-month-sel:active{transform:scale(.97)}
.btn-submit:hover{filter:brightness(1.08)}
.list-card,.chart-card,.form-card,.fatura-card,.conf-bank-block,.month-mgr,.mcard{border-color:rgba(var(--ink-rgb),.07)}
.fatura-card{transition:transform .2s}
.cloud-toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;background:var(--elev);color:var(--text);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.cloud-toast.show{opacity:1;transform:translate(-50%,0)}
.cloud-toast.ok{border-color:rgba(74,222,128,.4)}.cloud-toast.err{border-color:rgba(248,113,113,.45)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){
  .hero{padding:18px}
  .hero-val{font-size:34px}
  .bnav-btn{font-size:10px;min-height:54px}

function catIcon(id){return CAT_ICONS[id]||CAT_ICONS.outros;}

function catByID(id){return CATS.find(c=>c.id===id)||{id:'outros',label:'Outros',emoji:'📦',color:'#64748b'};}

const CLOUD_URL='https://script.google.com/macros/s/AKfycbyIgx5yPBXXTcM0iNAy7D31DeWjhTjr7Ap1RKOqG6s2pX7cdV89VKxsyQNLlaVdwfzE1g/exec';

// -- CLOUD SYNC --
// -- FILA DE SALVAMENTO NA NUVEM --
let _syncPendente=false;
let _syncTimer=null;
let _syncStatus='ok'; // 'ok' | 'pendente' | 'erro'

function setSyncStatus(status){
  _syncStatus=status;
  const el=document.getElementById('sync-indicator');
  if(!el)return;
  if(status==='ok'){el.innerHTML='<span class="ti-svg" ><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16l-4 4-4-4"/><path d="M20 16.7A5 5 0 0018 7h-1.26A8 8 0 104 15.25"/></svg></span>';el.title='Sincronizado com a nuvem';el.style.color='#4ade80';el.style.opacity='1';}
  else if(status==='pendente'){el.innerHTML='<span class="ti-svg" ><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V12m0 0l-3 3m3-3l3 3"/><path d="M20 16.7A5 5 0 0018 7h-1.26A8 8 0 104 15.25"/></svg></span>';el.title='Salvando na nuvem...';el.style.color='#fbbf24';el.style.opacity='1';}
  else if(status==='erro'){el.innerHTML='<span class="ti-svg" ><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><path d="M20 16.7A5 5 0 0018 7h-1.26a8.1 8.1 0 00-.26-1M10.29 5.29A8 8 0 104 15.25"/></svg></span>';el.title='Erro ao salvar na nuvem — dados salvos localmente';el.style.color='#f87171';el.style.opacity='1';}
}

// -- CHAVE DA NUVEM --
// A chave fica só neste aparelho (localStorage), nunca no código. A planilha recusa pedidos sem ela.
const CHAVE_SK='mv_chave_nuvem';
function getChave(){try{return localStorage.getItem(CHAVE_SK)||'';}catch(e){return '';}}
function setChave(v){try{v?localStorage.setItem(CHAVE_SK,v):localStorage.removeItem(CHAVE_SK);}catch(e){}}
function urlNuvem(extra){const k=getChave();const qs=[k?'key='+encodeURIComponent(k):'',extra||''].filter(Boolean).join('&');return CLOUD_URL+(qs?'?'+qs:'');}
function ehNaoAutorizado(text){return /"erro"\s*:\s*"nao_autorizado"/.test(text||'');}
let _nuvemBloqueada=false;
function abrirModalChave(msg){
  if(document.getElementById('key-modal'))return;
  const bg=document.createElement('div');bg.id='key-modal';bg.className='key-modal-bg';
  bg.innerHTML=`<div class="key-modal" role="dialog" aria-modal="true" aria-labelledby="key-modal-t">
    <div class="key-modal-ic">🔒</div>
    <h3 id="key-modal-t">Chave da nuvem</h3>
    <p>${msg||'Digite a chave que protege seus dados na planilha. Ela fica salva só neste aparelho.'}</p>
    <div class="key-inp-wrap"><input type="password" id="inp-chave" placeholder="Sua chave secreta" autocomplete="current-password" value=""><button type="button" class="key-eye" onclick="const i=document.getElementById('inp-chave');i.type=i.type==='password'?'text':'password'" aria-label="Mostrar chave">👁</button></div>
    <div class="key-actions"><button type="button" class="btn-cancel" onclick="fecharModalChave()">Agora não</button><button type="button" class="btn-ok" onclick="salvarChaveModal()">Salvar e sincronizar</button></div>
  </div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)fecharModalChave();});
  document.body.appendChild(bg);
  const inp=document.getElementById('inp-chave');inp.value=getChave();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')salvarChaveModal();});
  setTimeout(()=>inp.focus(),50);
}
function fecharModalChave(){const m=document.getElementById('key-modal');if(m)m.remove();}
function salvarChaveModal(){
  const v=(document.getElementById('inp-chave').value||'').trim();
  if(!v){document.getElementById('inp-chave').focus();return;}
  setChave(v);fecharModalChave();_nuvemBloqueada=false;loadFromCloud();
}
function trocarChaveNuvem(){abrirModalChave('Digite a nova chave da nuvem. Ela precisa ser igual à configurada no Google Apps Script.');}

async function cloudSave(data){
  if(_nuvemBloqueada){setSyncStatus('erro');return false;}
  try{
    const r=await fetch(urlNuvem(),{method:'POST',body:JSON.stringify(data),headers:{'Content-Type':'text/plain'}});
    let text='';try{text=await r.text();}catch(e){}
    if(ehNaoAutorizado(text)){
      _nuvemBloqueada=true;setSyncStatus('erro');
      showSyncStatus('🔒 Chave da nuvem inválida — não salvou',false);
      abrirModalChave('A nuvem recusou o salvamento. Confira a chave. Seus dados continuam salvos neste aparelho.');
      return false;
    }
    setSyncStatus('ok');
    return true;
  }catch(e){
    console.warn('Cloud save failed:',e);
    setSyncStatus('erro');
    return false;
  }
}
async function cloudLoad(){
  try{
    const r=await fetch(urlNuvem('t='+Date.now()));
    const text=await r.text();
    if(ehNaoAutorizado(text)){_nuvemBloqueada=true;return null;}
    _nuvemBloqueada=false;
    if(!text||text==='{}')return null;
    const d=JSON.parse(text);
    if(d&&d.months&&d.months.length>0)return d;
  }catch(e){console.warn('Cloud load failed:',e);}
  return null;
}
function showSyncStatus(msg,ok){
  let el=document.getElementById('cloud-status');
  if(!el){el=document.createElement('div');el.id='cloud-status';document.body.appendChild(el);}
  el.removeAttribute('style');el.className='cloud-toast show '+(ok?'ok':'err');el.textContent=msg;
  clearTimeout(el._t);el._t=setTimeout(()=>{el.classList.remove('show');},2500);
}
const MONTH_NAMES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function gerarRelatorioReembolso(){
  const m=M();
  const todos=[...(m.mnu||[]),...(m.mc6||[]),...(m.rnu||[]),...(m.rc6||[])];
  const itens=todos.filter(it=>it.cat==='reembolso');
  if(!itens.length){showSyncStatus('Nenhum item de reembolso neste mês',false);return;}
  const total=itens.reduce((t,it)=>t+(+it.val||0),0);
  const hoje=new Date();
  const dataEmissao=hoje.toLocaleDateString('pt-BR');

  // Gera HTML do PDF em nova janela para impressão
  const linhasHTML=itens.map((it,i)=>`
    <tr style="background:${i%2===0?'#f9fafb':'#fff'}">

function load(){

      if(old){const d=JSON.parse(old);if(d&&d.months&&d.months.length>0){localStorage.setItem(SK,old);localStorage.removeItem(k);return d;}}
    }

    if(s){const d=JSON.parse(s);if(d&&d.months&&d.months.length>0)return d;}
  }catch(e){}

function ensureJunho(data){
  const hasJunho=data.months.some(m=>m.name==='Junho 2026');
  if(!hasJunho){const junho=defaultData().months[0];data.months.unshift(junho);data.current=Math.min(data.current+1,data.months.length-1);}

}

function guessCat(desc){
  const d=desc.toLowerCase();
  for(const rule of CAT_RULES){for(const term of rule.terms){if(d.includes(term))return rule.cat;}}
  return null;
}

const CAT_RULES_VERSION=7;
const CAT_OVERRIDES={'MARCELA SALAO':'reembolso','PURA VIDA':'reembolso'};

function applyOverrides(data){
  for(const mo of data.months){
    for(const key of ['mnu','mc6','rnu','rc6','fix']){
      for(const it of (mo[key]||[])){
        if(it._catManual)continue;
        const descUp=it.desc.toUpperCase();
        for(const [term,cat] of Object.entries(CAT_OVERRIDES)){if(descUp.includes(term)){it.cat=cat;it._catManual=true;break;}}
      }
    }
  }
}

const AUTO_CATS=new Set(['alimentacao','transporte','saude','compras','lazer','casa','assinaturas','vestuario','educacao','pet','viagem','reembolso','pix_credito','esportes','outros']);

function autoCategorize(data){
  let changed=0;
  const savedVersion=data._catRulesVersion||0;
  const forceAll=savedVersion<CAT_RULES_VERSION;
  for(const mo of data.months){
    for(const key of ['mnu','mc6','rnu','rc6','fix']){
      for(const it of (mo[key]||[])){
        if(it._catManual)continue;
        const novaCat=guessCat(it.desc);
        if(!novaCat)continue;
        if(!it.cat||AUTO_CATS.has(it.cat)){if(forceAll||!it.cat){it.cat=novaCat;changed++;}}
      }
    }
  }
  if(forceAll)data._catRulesVersion=CAT_RULES_VERSION;
  return changed;
}

function nextParcel(desc){
  const m=desc.match(/^(.*\s)(\d+)-(\d+)(\s*.*)$/);
  if(!m)return null;
  const atual=parseInt(m[2]),total=parseInt(m[3]);
  if(atual>=total)return null;
  return m[1]+(atual+1)+'-'+total+m[4];
}

function isParcelado(it){return /\d+-\d+/.test(it.desc);}
function descDisplay(desc){return desc.replace(/\s+\d+-\d+$/,'').trim();}

function repararParcelas(data){
  for(let i=0;i<data.months.length-1;i++){
    const origem=data.months[i];
    for(const key of ['mnu','mc6','rnu','rc6']){
      for(const it of (origem[key]||[])){
        if(!isParcelado(it)||it.recorrente)continue;
        let descAtual=it.desc;
        for(let j=i+1;j<data.months.length;j++){
          const proxDesc=nextParcel(descAtual);
          if(!proxDesc)break;
          const existente=data.months[j][key].find(x=>x.desc===proxDesc);
          if(!existente){
            // Verifica se foi deletado manualmente (marcado como _deletado)
            const deletado=data.months[j]._deletados&&data.months[j]._deletados.includes(key+'|'+proxDesc);
            if(!deletado) data.months[j][key].push({...it,desc:proxDesc,data:''});
          } else {
            if(!existente._catManual){if(it.cat)existente.cat=it.cat;else delete existente.cat;}
          }
          descAtual=proxDesc;
        }
      }
    }
  }
}

  const ctx=document.getElementById('chart-line');if(!ctx)return;
  if(chartLine){chartLine.destroy();chartLine=null;}
  const max=Math.max(...vals)||1;
  const min=Math.min(...vals)||0;

  const bgColors=vals.map(v=>{

function propagarEdicao(key, itemDesc, campos, mesOrigemIdx){
  // campos = { cat, cartao, data } -- propaga para parcelas/recorrentes nos meses seguintes
  let descAtual=itemDesc;
  for(let i=mesOrigemIdx+1;i<G.months.length;i++){
    const mo=G.months[i];
    const proxDesc=isParcelado({desc:descAtual})?nextParcel(descAtual):null;
    const alvo=mo[key]?.find(it=>it.desc===(proxDesc||descAtual));
    if(alvo){
      if(campos.cat!==undefined){
        if(campos.cat){alvo.cat=campos.cat;alvo._catManual=true;}
        else{delete alvo.cat;delete alvo._catManual;}
      }
      if(campos.cartao!==undefined){
        if(campos.cartao)alvo.cartao=campos.cartao;
        else delete alvo.cartao;
      }
      if(campos.data!==undefined){
        if(campos.data)alvo.data=campos.data;
        else delete alvo.data;
      }
    }
    if(proxDesc)descAtual=proxDesc;else break;
  }
}

// Varre TODOS os meses e propaga cartão de parcelas anteriores para as seguintes
// Usa descrição exata + data + valor como chave para evitar confundir itens similares
function sincronizarCartoes(){
  let total=0;
  for(let i=0;i<G.months.length-1;i++){
    const origem=G.months[i];
    for(const key of ['mnu','mc6','rnu','rc6']){
      for(const it of (origem[key]||[])){
        if(!it.cartao||!isParcelado(it)||it.recorrente) continue;
        let descAtual=it.desc;
        let dataRef=it.data||'';
        let valRef=+it.val||0;
        for(let j=i+1;j<G.months.length;j++){
          const proxDesc=nextParcel(descAtual);
          if(!proxDesc) break;
          const alvos=G.months[j][key]?.filter(x=>x.desc===proxDesc)||[];
          let alvo=null;
          if(alvos.length===1){
            alvo=alvos[0];
          } else if(alvos.length>1){
            alvo=alvos.find(x=>x.data===dataRef && +x.val===valRef)
              || alvos.find(x=>+x.val===valRef)
              || alvos.find(x=>x.data===dataRef)
              || null;
          }
          if(alvo&&!alvo._cartaoManual){
            alvo.cartao=it.cartao;
            total++;
          }
          if(alvo){
            dataRef=alvo.data||dataRef;
            valRef=+alvo.val||valRef;
          }
          descAtual=proxDesc;
        }
      }
    }
  }
  return total;
}

function sincronizarDatas(){
  let total=0;
  for(let i=0;i<G.months.length-1;i++){
    const origem=G.months[i];
    for(const key of ['mnu','mc6','rnu','rc6']){
      for(const it of (origem[key]||[])){
        if(!it.data||!isParcelado(it)||it.recorrente) continue;
        let descAtual=it.desc;
        let valRef=+it.val||0;
        for(let j=i+1;j<G.months.length;j++){
          const proxDesc=nextParcel(descAtual);
          if(!proxDesc) break;
          const alvos=G.months[j][key]?.filter(x=>x.desc===proxDesc)||[];
          let alvo=null;
          if(alvos.length===1){
            alvo=alvos[0];
          } else if(alvos.length>1){
            alvo=alvos.find(x=>+x.val===valRef && !x.data)
              || alvos.find(x=>+x.val===valRef)
              || null;
          }
          if(alvo&&!alvo.data){
            alvo.data=it.data;
            total++;
          }
          descAtual=proxDesc;
        }
      }
    }
  }
  return total;
}

function propagarCategoria(key,itemDesc,novaCat,mesOrigemIdx){

function saveEdit(){
  const desc=document.getElementById('ei-desc').value.trim();
  const val=parseFloat(document.getElementById('ei-val').value);
  const data=document.getElementById('ei-date').value.trim();
  const cat=document.getElementById('ei-cat')?.value||'';
  const cartao=document.getElementById('ei-cartao')?.value||'';
  if(!desc||isNaN(val))return;
  const key=editState.key;
  const it=M()[key][editState.idx];
  it.desc=desc;it.val=val;it.data=data;
  if(cat){it.cat=cat;it._catManual=true;}else{delete it.cat;delete it._catManual;}
  if(cartao){it.cartao=cartao;it._cartaoManual=true;}else{delete it.cartao;delete it._cartaoManual;}
  if(key!=='fix'){if(window._editRec)it.recorrente=true;else delete it.recorrente;}
  // Propaga categoria, cartão e data para parcelas/recorrentes seguintes
  if(isParcelado(it)||it.recorrente){
    propagarEdicao(key,it.desc,{cat:cat||null,cartao:cartao||null,data:data||null},G.current);
  }
  editState={key:null,idx:null};save();renderAll();
}

function confirmDel(key,idx){

    <button class="btn-cancel" onclick="cancelEdit()">Cancelar</button>
  </div>`;
}
function delItem(key,idx){
  const it=M()[key][idx];
  // Se for parcelado, registra como deletado manualmente para não ser recriado
  if(it&&isParcelado(it)&&!it.recorrente){
    if(!M()._deletados) M()._deletados=[];
    const registro=key+'|'+it.desc;
    if(!M()._deletados.includes(registro)) M()._deletados.push(registro);
  }
  M()[key].splice(idx,1);
  save();renderAll();
}

function renderFixos(){
  const m=M();
  const items=m.fix||[];
  const MONTH_NAMES_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const partes=m.name.split(' ');
  const mesIdx=MONTH_NAMES_PT.indexOf(partes[0]);
  const anoMes=parseInt(partes[1])||new Date().getFullYear();

  function vencBadge(venc,pago){
    if(!venc||pago)return '';const d=parseInt(venc);if(isNaN(d))return '';
    const hoje=new Date();
    if(anoMes>hoje.getFullYear()||(anoMes===hoje.getFullYear()&&mesIdx>hoje.getMonth())){return `<span style="font-size:10px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--chip-bg);color:#64748b;margin-left:6px">📅 dia ${d}</span>`;}
    else if(anoMes<hoje.getFullYear()||(anoMes===hoje.getFullYear()&&mesIdx<hoje.getMonth())){return `<span style="font-size:10px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--bad-bg);color:var(--neg);margin-left:6px">📅 Vencido</span>`;}
    else{
      const diff=d-hoje.getDate();let bg,col,lbl;
      if(diff<0){bg='#450a0a';col='#f87171';lbl='Vencido';}
      else if(diff===0){bg='#422006';col='#fb923c';lbl='Hoje';}
      else if(diff<=3){bg='#422006';col='#fb923c';lbl=diff+'d';}
      else{return `<span style="font-size:10px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--chip-bg);color:#64748b;margin-left:6px">📅 dia ${d}</span>`;}
      return `<span style="font-size:10px;font-weight:600;padding:1px 7px;border-radius:6px;background:${bg};color:${col};margin-left:6px">📅 ${lbl}</span>`;
    }
  }
  function fixRow(it,i){
    return `<div id="row-fix-${i}" style="${it.pago?'opacity:.55':''}">
      <div class="item">
        <div class="item-icon" style="background:${it.pago?'var(--surface2)':'var(--fix-bg)'}">${it.pago?'✅':'🏠'}</div>
        <div class="item-body">
          <div class="item-desc" style="${it.pago?'text-decoration:line-through;color:var(--text3)':''}">${descDisplay(it.desc)}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap">
            ${(()=>{const pm=it.desc.match(/(\d+)-(\d+)/);const parc=pm?`${pm[1]}/${pm[2]}`:null;if(it.data&&parc)return`<span style="display:inline-flex;align-items:center;border-radius:8px;overflow:hidden;background:rgba(var(--ink-rgb),.05)"><span style="font-size:12px;color:var(--text2);padding:3px 9px">${it.data}</span><span style="width:1px;background:var(--border);align-self:stretch"></span><span style="font-size:11px;font-weight:700;color:var(--blue-txt);padding:3px 9px;background:rgba(37,99,235,.18)">${parc}</span></span>`;if(parc)return`<span style="display:inline-flex;align-items:center;border-radius:8px;overflow:hidden;background:rgba(37,99,235,.18)"><span style="font-size:11px;font-weight:700;color:var(--blue-txt);padding:3px 9px">${parc}</span></span>`;if(it.data)return`<span style="font-size:11px;color:#64748b">${it.data}</span>`;return'';})()}
            ${vencBadge(it.venc,it.pago)}
            ${it.cat?(()=>{const c=catByID(it.cat);return `<span style="font-size:10px;font-weight:600;padding:1px 7px;border-radius:6px;background:${c.color}22;color:${c.color}">${c.emoji} ${c.label}</span>`;})():''}
            ${it.cartao?`<span style="font-size:10px;color:var(--text3)">💳 ${cartaoLabel(it.cartao)}</span>`:''}
          </div>
        </div>
        <div class="item-right">
          <span class="item-val">${fmt(it.val)}</span>
          <div class="item-actions">
            <button class="act-btn" style="background:${it.pago?'var(--ok-bg)':'var(--surface2)'};border:1px solid ${it.pago?'#16a34a':'var(--border)'}" onclick="togglePago(${i})">${it.pago?'✅':'☑️'}</button>
            <div class="action-menu-wrap">
              <button class="action-menu-btn" onclick="toggleMenu(event,'menu-fix-${i}')">⋯</button>
              <div class="action-menu" id="menu-fix-${i}">
                <button class="action-menu-item" onclick="closeMenu();startEditFix(${i})">✏️ Editar</button>
                <button class="action-menu-item danger" onclick="closeMenu();confirmDel('fix',${i})">🗑️ Excluir</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }
  const rows=items.length?items.map((it,i)=>fixRow(it,i)).join(''):`<div class="empty">Nenhum fixo</div>`;

  const total=sum(items),pago=items.filter(i=>i.pago).reduce((t,i)=>t+(+i.val||0),0),pct=total>0?Math.round(pago/total*100):0;
  document.getElementById('tab-fixos').innerHTML=`<div>
    <div class="page-title">🏠 Fixos</div>
    <div style="background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px">
        <span style="font-size:13px;font-weight:600">Progresso do mês</span>
        <span style="font-size:13px;font-weight:700;color:var(--fix)">${pct}% pago</span>
      </div>
      <div class="track"><div class="fill" style="width:${pct}%;background:var(--fix)"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:10px">
        <div style="text-align:center"><div style="font-size:14px;font-weight:700;color:var(--fix)">${fmt(pago)}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">✅ Pago</div></div>
        <div style="text-align:center"><div style="font-size:14px;font-weight:700;color:var(--danger)">${fmt(total-pago)}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">⏳ Pendente</div></div>
        <div style="text-align:center"><div style="font-size:14px;font-weight:700">${fmt(total)}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">Total</div></div>
      </div>
    </div>
    <div class="list-card">
      <div class="list-head"><div class="list-title"><span class="pill pill-fix">Sem cartão</span> Fixos</div><span style="font-size:11px;color:var(--text3)">${items.length} itens</span></div>
      <div>${rows}</div>
      <div class="list-foot"><span class="foot-lbl">Total</span><span class="foot-val">${fmt(total)}</span></div>
    </div>
    ${G.current>0?`<button onclick="sincronizarFixos()" style="width:100%;padding:12px;border-radius:12px;border:2px dashed var(--fix-bg);background:transparent;color:var(--fix);font-size:13px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:4px">🔄 Sincronizar fixos do mês anterior</button>`:''}
  </div>`;
}

function sincronizarFixos(){
  const mesAnterior=G.months[G.current-1];
  if(!mesAnterior) return;
  const fixAtual=M().fix||[];
  const fixAnterior=mesAnterior.fix||[];
  let adicionados=0;
  for(const it of fixAnterior){
    if(isParcelado(it)){
      // FEATURE 4: parcelado fixo - avanca a parcela
      const proxDesc=nextParcel(it.desc);
      if(!proxDesc) continue; // ultima parcela, nao propaga
      const jaExiste=fixAtual.some(f=>f.desc===proxDesc);
      if(!jaExiste){
        M().fix.push({...it, desc:proxDesc, pago:false, data:''});
        adicionados++;
      }
    } else {
      // fixo normal - copia igual
      const jaExiste=fixAtual.some(f=>f.desc===it.desc);
      if(!jaExiste){
        M().fix.push({...it, pago:false, data:''});
        adicionados++;
      }
    }
  }
  if(adicionados>0){
    save();
    renderFixos();
    showSyncStatus(`✅ ${adicionados} fixo(s) sincronizado(s)!`, true);
  } else {
    showSyncStatus('ℹ️ Nenhum fixo novo para sincronizar', true);
  }
}

function saveEditFix(idx){
  const desc=document.getElementById('ei-desc').value.trim();
  const val=parseFloat(document.getElementById('ei-val').value);
  const data=document.getElementById('ei-date').value.trim();
  const venc=document.getElementById('ei-venc').value.trim();
  const cat=document.getElementById('ei-cat')?.value||'';
  const cartao=document.getElementById('ei-cartao')?.value||'';
  if(!desc||isNaN(val))return;
  const it=M().fix[idx];
  const catMudou=it.cat!==cat;
  it.desc=desc;it.val=val;it.data=data;it.venc=venc;
  if(cat){it.cat=cat;it._catManual=true;}else{delete it.cat;delete it._catManual;}
  if(cartao){it.cartao=cartao;}else{delete it.cartao;}
  if(catMudou){propagarCategoria('fix',it.desc,cat||null,G.current);}
  editState={key:null,idx:null};save();renderFixos();
}

function addCartao(banco){
  // Para Nubank, oferece também a opção Pix Crédito
  if(banco==='nu'){
    const cartoes=loadCartoes();
    const temPix=cartoes.some(c=>c.banco==='nu'&&c.digitos==='PIX_CREDITO');
    const temBoleto=cartoes.some(c=>c.banco==='nu'&&c.digitos==='BOLETO_CREDITO');
    const opcao=prompt(
      'Nubank — o que deseja adicionar?\n\n1 = Pix no Crédito\n2 = Boleto no Crédito\n3 = Cartão físico (4 dígitos)\n\nDigite 1, 2 ou 3:'
    );
    if(!opcao||!opcao.trim())return;
    if(opcao.trim()==='1'){
      if(temPix){alert('Pix Crédito já cadastrado!');return;}
      cartoes.push({id:'nu_PIX_CREDITO_'+Date.now(),banco:'nu',digitos:'PIX_CREDITO'});
      saveCartoes(cartoes);renderMeses();return;
    }
    if(opcao.trim()==='2'){
      if(temBoleto){alert('Boleto Crédito já cadastrado!');return;}
      cartoes.push({id:'nu_BOLETO_CREDITO_'+Date.now(),banco:'nu',digitos:'BOLETO_CREDITO'});
      saveCartoes(cartoes);renderMeses();return;
    }
  }
  const digitos=prompt('Digite os 4 últimos dígitos do cartão '+(banco==='nu'?'Nubank':'C6')+':');
  if(!digitos||!digitos.trim())return;
  const d=digitos.trim().replace(/\D/g,'').slice(0,4);
  if(d.length!==4){alert('Digite exatamente 4 dígitos!');return;}
  const cartoes=loadCartoes();
  if(cartoes.some(c=>c.banco===banco&&c.digitos===d)){alert('Cartão já cadastrado!');return;}
  cartoes.push({id:banco+'_'+d+'_'+Date.now(),banco,digitos:d});
  saveCartoes(cartoes);
  renderMeses();
}
function deleteCartao(id){
  if(!confirm('Excluir este cartão?'))return;
  const cartoes=loadCartoes().filter(c=>c.id!==id);
  saveCartoes(cartoes);
  renderMeses();
}

// -- CONFERÊNCIA --
function confKey(){return 'conferencia_mv_'+M().name.replace(' ','_');}
// Marcações da conferência ficam dentro do próprio mês (M().conf) e vão para a nuvem com os dados.
// Marcações antigas, que ficavam só no aparelho (localStorage), são migradas na primeira leitura.
function loadConf(){
  const m=M();
  let local=null;
  try{const s=localStorage.getItem(confKey());if(s)local=JSON.parse(s);}catch(e){}
  if(local&&typeof local==='object'){
    const nuvem=m.conf&&typeof m.conf==='object'?m.conf:{};
    m.conf=Object.assign({},local,nuvem); // em conflito, vale o que já está na nuvem
    try{localStorage.removeItem(confKey());}catch(e){}
    save();
  }
  return Object.assign({},m.conf||{});
}
function saveConf(conf){M().conf=conf;save();}
function clearConf(){M().conf={};try{localStorage.removeItem(confKey());}catch(e){}save();renderConferencia();}

function confItemKey(key,it){
  return key+'|'+it.desc+'|'+it.val;
}
function toggleConfItem(bankKey,idx,estado){
  const conf=loadConf();
  const it=M()[bankKey][idx];
  if(!it)return;
  const key=confItemKey(bankKey,it);
  if(conf[key]===estado){delete conf[key];}else{conf[key]=estado;}
  saveConf(conf);renderConferencia();
}

function proximoDiaUtil(ano, mes, dia){
  // Feriados nacionais fixos (dia/mes)
  const feriadosFixos=['01/01','21/04','01/05','07/09','12/10','02/11','15/11','25/12'];
  const d = new Date(ano, mes, dia);
  function ehFeriado(dt){
    const str=String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0');
    return feriadosFixos.includes(str);
  }
  // Avança enquanto for fim de semana ou feriado
  while(d.getDay()===0||d.getDay()===6||ehFeriado(d)){
    d.setDate(d.getDate()+1);
  }
  return d;
}

// -- DATAS DOS CARTÕES --
// Vencimento por banco. C6 mudou de dia 05 para dia 15 a partir da fatura de Dezembro/2026.
// Fechamento estimado: FECHA_ANTES dias antes do vencimento.
const FECHA_ANTES=7;
function diaVencimento(banco,anoFatura,mesFaturaIdx){
  if(banco==='nu')return 9;
  const ord=anoFatura*12+mesFaturaIdx;
  return ord>=2026*12+11?15:5;
}
function vencimentoFatura(banco,anoFatura,mesFaturaIdx){return proximoDiaUtil(anoFatura,mesFaturaIdx,diaVencimento(banco,anoFatura,mesFaturaIdx));}
function fechamentoFatura(banco,anoFatura,mesFaturaIdx){
  const d=new Date(anoFatura,mesFaturaIdx,diaVencimento(banco,anoFatura,mesFaturaIdx));
  d.setDate(d.getDate()-FECHA_ANTES);return d;
}

function infoFaturaBanco(){
  const MESES_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const partes=M().name.split(' ');
  const mesIdx=MESES_PT.indexOf(partes[0]);
  const ano=parseInt(partes[1])||new Date().getFullYear();
  if(mesIdx<0) return null;

  // Fatura do banco = mês seguinte
  const mesFaturaIdx=(mesIdx+1)%12;
  const anoFatura=mesIdx===11?ano+1:ano;
  const nomeFatura=MESES_PT[mesFaturaIdx]+' '+anoFatura;

  // Dia útil de vencimento
  const vencNU=vencimentoFatura('nu', anoFatura, mesFaturaIdx);
  const vencC6=vencimentoFatura('c6', anoFatura, mesFaturaIdx);

  const fmtData=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;

  return {nomeFatura, vencNU:fmtData(vencNU), vencC6:fmtData(vencC6)};
}

      <div style="display:flex;gap:8px">

  setTimeout(()=>{ const el=document.getElementById('conf-valor-input'); if(el){el.focus();el.select();} }, 100);
}

function salvarValorConf(key, idx){
  const input = document.getElementById('conf-valor-input');
  if(!input) return;
  const novoVal = parseFloat(input.value);
  if(isNaN(novoVal)||novoVal<=0){ alert('Valor inválido!'); return; }

  const it = M()[key][idx];
  if(!it) return;

  it.val = parseFloat(novoVal.toFixed(2));

  // Propaga para parcelas seguintes se for parcelado
  if(isParcelado(it)&&!it.recorrente){
    propagarEdicao(key, it.desc, {}, G.current); // mantém outros campos
    // Propaga valor manualmente
    let descAtual = it.desc;
    for(let j=G.current+1; j<G.months.length; j++){
      const proxDesc = nextParcel(descAtual);
      if(!proxDesc) break;
      const alvo = G.months[j][key]?.find(x=>x.desc===proxDesc);
      if(alvo) alvo.val = it.val;
      descAtual = proxDesc;
    }
  }

  document.getElementById('conf-valor-modal')?.remove();
  save();
  showSyncStatus('✅ Valor atualizado!', true);
  renderConferencia();
  if(activeTab==='marcio') renderMarcio();
  if(activeTab==='raissa') renderRaissa();
}

function editarCartaoConf(key, idx, banco){
  // Busca o item no mês atual
  const it = M()[key][idx];
  if(!it) return;

  // Monta opções de cartão do banco
  const cartoes = getCartoes(banco);
  if(!cartoes.length){
    showSyncStatus('Nenhum cartão cadastrado para este banco', false);
    return;
  }

  // Cria modal inline
  const existing = document.getElementById('conf-cartao-modal');
  if(existing) existing.remove();

  const opts = `<option value="">— Sem cartão —</option>` +
    cartoes.map(c=>`<option value="${c.digitos}"${it.cartao===c.digitos?' selected':''}>${cartaoLabel(c.digitos)}</option>`).join('');

  const modal = document.createElement('div');
  modal.id = 'conf-cartao-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `
    <div style="background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:320px;border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.4)">
      <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px">Editar forma de pagamento</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.desc}</div>
      <select id="conf-cartao-sel" style="width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-size:14px;margin-bottom:14px">${opts}</select>
      <div style="display:flex;gap:8px">
        <button onclick="salvarCartaoConf('${key}',${idx})" style="flex:1;padding:11px;background:var(--nu);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">Salvar</button>
        <button onclick="document.getElementById('conf-cartao-modal').remove()" style="flex:1;padding:11px;background:var(--surface2);color:var(--text2);border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer">Cancelar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e=>{ if(e.target===modal) modal.remove(); });
}

function salvarCartaoConf(key, idx){
  const sel = document.getElementById('conf-cartao-sel');
  if(!sel) return;
  const novoCartao = sel.value;
  const it = M()[key][idx];
  if(!it) return;

  // Atualiza o lançamento original
  if(novoCartao){ it.cartao = novoCartao; it._cartaoManual = true; }
  else { delete it.cartao; delete it._cartaoManual; }

  // Propaga para parcelas seguintes
  if(isParcelado(it)&&!it.recorrente){
    propagarEdicao(key, it.desc, {cartao: novoCartao||null}, G.current);
  }
  document.getElementById('conf-cartao-modal')?.remove();
  save();
  showSyncStatus('✅ Cartão atualizado e propagado!', true);
  renderConferencia();
  // Atualiza também a aba de Márcio/Raíssa se estiver ativa
  if(activeTab==='marcio') renderMarcio();
  if(activeTab==='raissa') renderRaissa();
}

// Estado de colapso da conferência — global para ser acessível pelo onclick
window._confExpanded = window._confExpanded || {};
function toggleExpand(id){
  window._confExpanded[id]=!window._confExpanded[id];
  renderConferencia();
}
// Event delegation para os botões de colapso da conferência
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-expand]');
  if(el){
    e.stopPropagation();
    e.preventDefault();
    const id=el.getAttribute('data-expand');
    window._confExpanded[id]=!window._confExpanded[id];
    renderConferencia();
  }
});

function normalizeText(str){
  return str.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[Ç]/g,'C').replace(/[ç]/g,'C');
}
function toCapitalize(str){
  return str.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
}

function migrateCapitalize(){
  if(!confirm('Isso vai converter os nomes de todos os lançamentos para Capitalize (ex: MAGALU → Magalu).\n\nUm backup será salvo automaticamente antes. Continuar?')) return;
  // Backup antes de qualquer mudança
  try{
    const backup=JSON.stringify(G);
    localStorage.setItem('mv_backup_capitalize_'+Date.now(),backup);
  }catch(e){
    alert('Não foi possível criar o backup. Operação cancelada.');return;
  }
  // Converte todos os desc em todos os meses
  const KEYS=['mnu','mc6','rnu','rc6','fix'];
  let total=0;
  for(const mo of G.months){
    for(const key of KEYS){
      if(!mo[key]) continue;
      for(const it of mo[key]){
        // Separa desc base e sufixo de parcela (ex: "MAGALU 3-12" → base:"MAGALU", suf:" 3-12")
        const m=it.desc.match(/^([\s\S]+?)(\s+\d+-\d+)?$/);
        if(m){
          const base=toCapitalize(m[1].trim());
          const suf=m[2]||'';
          const novoDesc=base+suf;
          if(novoDesc!==it.desc){it.desc=novoDesc;total++;}
        }
      }
    }
  }
  save();
  render();
  const msg=`✅ ${total} lançamentos convertidos!\n\nBackup salvo no localStorage com a chave mv_backup_capitalize_*.\nSe precisar desfazer, fale comigo.`;
  alert(msg);
}

function propagarParcelas(key,item,mesOrigemIdx){
  let descAtual=item.desc;
  for(let i=mesOrigemIdx+1;i<G.months.length;i++){
    const proxDesc=nextParcel(descAtual);if(!proxDesc)break;
    const proxItem={...item,desc:proxDesc,data:''};
    // FEATURE 4: fixos propagados comecam nao pagos
    if(key==='fix')proxItem.pago=false;
    const jaExiste=(G.months[i][key]||[]).some(it=>it.desc===proxDesc);
    if(!jaExiste){
      if(!G.months[i][key])G.months[i][key]=[];
      G.months[i][key].push(proxItem);
    }
    descAtual=proxDesc;
  }
}

function addGasto(){
  const pessoa=document.getElementById('f-pessoa').value;
  const tipo=document.getElementById('f-tipo').value;
  const desc=toCapitalize(document.getElementById('f-desc').value.trim());
  const valTotal=parseFloat(document.getElementById('f-val').value);
  const data=document.getElementById('f-data').value.trim();
  const cat=document.getElementById('f-cat')?.value||'';
  const cartao=document.getElementById('f-cartao')?.value||'';
  const pAtual=parseInt(document.getElementById('f-parc-atual')?.value)||0;
  const pTotal=parseInt(document.getElementById('f-parc-total')?.value)||0;
  const venc=tipo==='fix'?(document.getElementById('f-venc')?.value.trim()||''):'';
  const recorrente=tipo!=='fix'&&(window._recorrente||false);
  if(!desc||isNaN(valTotal)||valTotal<=0)return;

  const isParc=pTotal>1;
  const sufixo=isParc?(pAtual&&pTotal?' '+pAtual+'-'+pTotal:' 1-'+pTotal):'';

  // -- DIVISÃO COM RAÍSSA --
  if(window._divisaoAtiva&&tipo!=='fix'){
    const valM=parseFloat(document.getElementById('f-val-m')?.value)||0;
    const valR=parseFloat(document.getElementById('f-val-r')?.value)||0;
    if(valM<=0||valR<=0){alert('Informe os valores de Márcio e Raíssa para dividir!');return;}

    const keyM=tipo==='nu'?'mnu':'mc6';
    const keyR=tipo==='nu'?'rnu':'rc6';

    const itemM={desc:desc+sufixo,val:parseFloat(valM.toFixed(2)),data};
    const itemR={desc:desc+sufixo,val:parseFloat(valR.toFixed(2)),data};
    if(cat){itemM.cat=cat;itemM._catManual=true;itemR.cat=cat;itemR._catManual=true;}
    if(cartao){itemM.cartao=cartao;itemR.cartao=cartao;}
    if(recorrente){itemM.recorrente=true;itemR.recorrente=true;}

    M()[keyM].push(itemM);
    M()[keyR].push(itemR);

    if(isParc){propagarParcelas(keyM,itemM,G.current);propagarParcelas(keyR,itemR,G.current);}
    save();renderAll();
    ['f-desc','f-val','f-data','f-parc-atual','f-parc-total','f-venc','f-cat','f-val-m','f-val-r'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    const prev=document.getElementById('parc-preview');if(prev)prev.style.display='none';
    const prevDiv=document.getElementById('divisao-preview');if(prevDiv)prevDiv.textContent='';
    const futuros=G.months.length-1-G.current;
    const t=document.getElementById('toast-g');
    if(t){t.textContent=`✅ Dividido! 👤 Márcio ${fmt(valM)} · 💜 Raíssa ${fmt(valR)}${isParc&&futuros>0?' + parcelas propagadas':''}`;t.style.display='block';setTimeout(()=>{t.style.display='none';},3000);}
    return;
  }

  // -- LANÇAMENTO NORMAL --
  const valFinal=valTotal; // valor digitado já é o da parcela
  const key=pessoa==='Márcio'?(tipo==='nu'?'mnu':tipo==='c6'?'mc6':'fix'):(tipo==='nu'?'rnu':'rc6');
  const item={desc:desc+sufixo,val:parseFloat(valFinal.toFixed(2)),data};
  if(cat){item.cat=cat;item._catManual=true;}
  if(cartao)item.cartao=cartao;
  if(tipo==='fix'&&venc)item.venc=venc;
  if(recorrente)item.recorrente=true;
  M()[key].push(item);
  // FEATURE 4: propagar parcelas para fixos tambem
  if(isParc){propagarParcelas(key,item,G.current);}
  save();renderAll();
  ['f-desc','f-val','f-data','f-parc-atual','f-parc-total','f-venc','f-cat'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  const prev=document.getElementById('parc-preview');if(prev)prev.style.display='none';
  const futuros=G.months.length-1-G.current;
  if(isParc&&futuros>0){
    const t=document.getElementById('toast-g');
    if(t){t.textContent=`✅ Lançado + parcelas propagadas para ${futuros} mês(es)!`;t.style.display='block';setTimeout(()=>{t.style.display='none';},3000);}
  }else{showToast('toast-g');}
}

function criarMesInteligente(name){
  const origem=M();const novo=blankMonth(name);
  novo.entradas=origem.entradas.filter(i=>i.recorrente).map(i=>({...i,data:''}));
  function processarCartao(items){
    const result=[];
    for(const it of items){
      if(it.recorrente){result.push({...it,data:''});}
      else if(isParcelado(it)){const novaDesc=nextParcel(it.desc);if(novaDesc){result.push({...it,desc:novaDesc,data:''}); }}
    }
    return result;
  }
  novo.mnu=processarCartao(origem.mnu);novo.mc6=processarCartao(origem.mc6);
  novo.rnu=processarCartao(origem.rnu);novo.rc6=processarCartao(origem.rc6);
  // FEATURE 4: fixos parcelados avancam a parcela ao criar novo mes
  novo.fix=origem.fix.map(i=>{
    if(isParcelado(i)){
      const proxDesc=nextParcel(i.desc);
      if(!proxDesc)return null; // ultima parcela, nao inclui
      return {...i,desc:proxDesc,pago:false,data:''};
    }
    return {...i,pago:false,data:''};
  }).filter(Boolean);
  return novo;
}

      </div>
    </div>`;

  }

  const meses=G.months;
  const labels=meses.map(mo=>mo.name.split(' ')[0].slice(0,3));

  const tetosMes=meses.map(mo=>+(sum(mo.entradas)).toFixed(2));

  // Cores relativas ao período (igual ao chart do painel)
  const maxV=Math.max(...totaisMarcio)||1;
  const minV=Math.min(...totaisMarcio)||0;
  const rangeV=maxV-minV||1;
  const bgColors=totaisMarcio.map(v=>{const p=(v-minV)/rangeV;return p>=0.66?'#ef444450':p>=0.33?'#eab30850':'#22c55e50';});
  const bdColors=totaisMarcio.map(v=>{const p=(v-minV)/rangeV;return p>=0.66?'#ef4444':p>=0.33?'#eab308':'#22c55e';});

  // Tabela de categorias — últimos N meses (máx 6)
  const nCols=Math.min(meses.length,6);
  const mesesCols=meses.slice(-nCols);
  const labelsCols=mesesCols.map(mo=>mo.name.split(' ')[0].slice(0,3));
  const keys=['mnu','mc6','fix'];
  const catIds=new Set();
  mesesCols.forEach(mo=>keys.flatMap(k=>mo[k]||[]).forEach(it=>catIds.add(it.cat||'outros')));
  const catsSorted=[...catIds].sort((a,b)=>{
    const totB=mesesCols.reduce((t,mo)=>t+keys.flatMap(k=>mo[k]||[]).filter(i=>(i.cat||'outros')===b).reduce((s,i)=>s+(+i.val||0),0),0);
    const totA=mesesCols.reduce((t,mo)=>t+keys.flatMap(k=>mo[k]||[]).filter(i=>(i.cat||'outros')===a).reduce((s,i)=>s+(+i.val||0),0),0);
    return totB-totA;
  }).slice(0,8);

  const dadosCat=catsSorted.map(id=>{
    const vals=mesesCols.map(mo=>+keys.flatMap(k=>mo[k]||[]).filter(i=>(i.cat||'outros')===id).reduce((t,i)=>t+(+i.val||0),0).toFixed(2));
    return{id,vals};
  });

  // Insight automático: categoria com maior variação absoluta
  let insightHtml='';
  if(dadosCat.length>0&&nCols>=2){
    let maxVar=0,maxCatId='',maxA=0,maxB=0;
    dadosCat.forEach(({id,vals})=>{
      const v=Math.abs(vals[vals.length-1]-vals[vals.length-2]);
      if(v>maxVar){maxVar=v;maxCatId=id;maxA=vals[vals.length-2];maxB=vals[vals.length-1];}
    });
    if(maxCatId){
      const c=catByID(maxCatId);
      const up=maxB>maxA;const pct=maxA>0?Math.round(Math.abs(maxB-maxA)/maxA*100):0;
      const colI=up?'#f87171':'#4ade80';

// Anima valores marcados com data-countup (ex.: saldo do painel)
function animateCountUps(root){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  (root||document).querySelectorAll('[data-countup]').forEach(el=>{
    const alvo=parseFloat(el.dataset.countup);if(!isFinite(alvo))return;
    const t0=performance.now(),dur=650;
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(alvo*e);if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}
